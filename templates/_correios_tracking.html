<section class="{{ card_class }} postal-card hidden" id="{{ card_id }}" aria-labelledby="{{ card_id }}Title">
  <div class="{{ head_class }} postal-head">
    <div>
      <span class="postal-mark" role="img" aria-label="Correios"></span>
      <h3 id="{{ card_id }}Title">Acompanhe cada movimentação</h3>
    </div>
  </div>
  <div class="postal-body">
    <div class="postal-code-wrap">
      <span class="postal-code-label">Código de rastreio</span>
      <div class="postal-code-row">
        <strong class="{{ value_class }} postal-code" id="{{ code_id }}" data-postal-code>—</strong>
        <button type="button" class="{{ copy_class }} postal-copy" data-postal-copy aria-label="Copiar código de rastreio">
          <span class="postal-copy-text">Copiar</span><span class="postal-copied-text">Copiado</span>
        </button>
      </div>
    </div>
    <a class="{{ action_class }} postal-action" id="{{ link_id }}" data-postal-link target="_blank" rel="noopener noreferrer" aria-label="Rastrear nos Correios (abre o site dos Correios em nova aba)">
      Rastrear nos Correios
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8" /></svg>
    </a>
  </div>
  <span class="postal-sr" data-postal-status role="status" aria-live="polite"></span>
</section>
