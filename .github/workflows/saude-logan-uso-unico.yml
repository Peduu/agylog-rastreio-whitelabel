# USO UNICO (so leitura): saude da rotina Logan->TMS (atraso dos envios) e entregas as 18:00 no banco do portal. Log so com
# contagens e datas (sem pedidos). Nao grava nada. Apagar depois do uso.
name: "Uso unico - Saude Logan e datas de entrega"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Conferencia so leitura (VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -uo pipefail
            T=$(mktemp -d)
            cat > "$T/sonda.py" <<'PY'
            import re, sqlite3
            from collections import Counter, defaultdict
            from datetime import datetime, timedelta

            CCXP = "15871195"
            agora = datetime.now()
            print("agora no servidor:", agora.strftime("%Y-%m-%d %H:%M:%S"))


            def mascara(t):
                t = re.sub(r"[A-Z0-9]{9,}", "***", str(t))
                t = re.sub(r"\d{5,}", "99999", t)
                return t


            # 1) Frescor dos envios ao TMS (rotina Logan): atraso entre o evento da Logan e o envio ao TMS
            st = sqlite3.connect("file:/home/projetos/atualizar_logan/ocoren_logan_tms/runtime/state/processor_state.sqlite3?mode=ro", uri=True)
            atrasos, por_janela, eventos_hoje = [], Counter(), 0
            for chave, remoto, enviado in st.execute("SELECT event_key, remote_name, sent_to_tms_at FROM processed_events "
                                                      "WHERE sent_to_tms_at >= ?", ((agora - timedelta(hours=2)).isoformat(timespec="seconds"),)):
                via = "recuperacao" if "RECOVERY" in (remoto or "").upper() else "arquivo"
                try:
                    env = datetime.fromisoformat(enviado)
                except ValueError:
                    continue
                por_janela[(env.strftime("%H:") + str(env.minute // 10) + "0", via)] += 1
                m = re.search(r"(\d{8} \d\d:\d\d:\d\d)", chave or "")
                if m:
                    ev = datetime.strptime(m.group(1), "%Y%m%d %H:%M:%S")
                    if ev.date() == agora.date():
                        eventos_hoje += 1
                        if env >= agora - timedelta(minutes=40):
                            atrasos.append((env - ev).total_seconds() / 60)
            print("\n== envios ao TMS nas ultimas 2h (janela de 10 min, via)")
            for (j, via), n in sorted(por_janela.items()):
                print(f"   {j} {via}: {n}")
            atrasos.sort()
            if atrasos:
                print(f"eventos de HOJE enviados nos ultimos 40 min: {len(atrasos)} | atraso evento->TMS (min): "
                      f"menor {atrasos[0]:.0f}, mediana {atrasos[len(atrasos) // 2]:.0f}, maior {atrasos[-1]:.0f}")
            print("eventos com data de hoje enviados nas ultimas 2h:", eventos_hoje)

            # 2) Saude da rodada principal (processor.log, ultimas 2h): mensagens agrupadas, sem pedidos
            L = "/home/projetos/atualizar_logan/ocoren_logan_tms/runtime/logs/processor.log"
            desde = (agora - timedelta(hours=1)).strftime("%Y-%m-%d %H:%M:%S")
            msgs, arquivos_fim, pendentes, inicios = Counter(), [], Counter(), 0
            for linha in open(L, encoding="utf-8", errors="replace"):
                if linha[:19] < desde:
                    continue
                partes = [p.strip() for p in linha.split("|")]
                if len(partes) < 3:
                    continue
                nivel, msg = partes[1], partes[2]
                msgs[(nivel, mascara(msg)[:80])] += 1
                if msg.startswith("Inicio do processamento"):
                    inicios += 1
                arq = next((p[8:] for p in partes if p.startswith("arquivo=")), "")
                data_arq = re.search(r"_(\d{8})_(\d\d)_(\d\d)", arq)
                if msg.startswith("Arquivo finalizado") and data_arq:
                    arquivos_fim.append((linha[:16], data_arq.group(1), " ".join(p for p in partes if p.split("=")[0] in ("validas", "enviadas", "ignoradas", "erros"))))
                if msg.startswith("Arquivo mantido pendente") and data_arq:
                    pendentes[data_arq.group(1) + "_" + data_arq.group(2) + data_arq.group(3)] += 1
            print("\n== processor.log na ultima 1h: rodadas iniciadas:", inicios)
            for (nivel, msg), n in msgs.most_common(22):
                print(f"   {n:5} x {nivel:7} {msg}")
            print("ultimos arquivos finalizados (hora do log | data do arquivo DDMMAAAA | resultado):")
            for a in arquivos_fim[-12:]:
                print("   ", a[0], "|", a[1], "|", a[2])
            print("arquivos mantidos pendentes na ultima 1h (data_hora do arquivo: vezes):", sorted(pendentes.items())[-15:])
            erros = Counter()
            for linha in open(L, encoding="utf-8", errors="replace"):
                if linha[:19] >= desde and ("| ERROR |" in linha or "| WARNING |" in linha):
                    e = re.search(r"erro=(.*)$", linha)
                    if e:
                        erros[mascara(e.group(1))[:150]] += 1
            print("motivos de erro/aviso (ultima 1h):")
            for e, n in erros.most_common(8):
                print(f"   {n:5} x {e}")

            # 3) Entregas no banco do portal: quantas caem exatamente as 18:00:00, por dia (CCXP x demais)
            p = sqlite3.connect("file:/home/rastreamento/database.db?mode=ro", uri=True)
            cols = [r[1] for r in p.execute("PRAGMA table_info(rastreios_ocorrencias)")]
            print("\n== colunas de rastreios_ocorrencias:", cols)
            dia = defaultdict(Counter)
            for dt, desc, badge, cnpj in p.execute(
                    "SELECT o.dt_ocorrencia, o.descricao, o.status_badge, r.cnpj_cliente FROM rastreios_ocorrencias o "
                    "JOIN rastreios r ON r.codigo = o.codigo"):
                if not (str(badge or "").lower() == "entregue" or "ENTREG" in str(desc or "").upper()):
                    continue
                if "DEVOL" in str(desc or "").upper() or "TENTATIVA" in str(desc or "").upper():
                    continue
                s = str(dt or "").replace("T", " ")
                m = re.search(r"(\d{4}-\d\d-\d\d|\d\d/\d\d/\d{4})[ ]+(\d\d:\d\d(:\d\d)?)", s)
                if not m:
                    continue
                d = m.group(1)
                if "/" in d:
                    d = d[6:10] + "-" + d[3:5] + "-" + d[0:2]
                if d < (agora - timedelta(days=14)).strftime("%Y-%m-%d"):
                    continue
                quem = "ccxp" if re.sub(r"\D", "", str(cnpj or "")).startswith(CCXP) else "outros"
                dia[d][quem + "_entregas"] += 1
                if m.group(2).startswith("18:00"):
                    dia[d][quem + "_as_18h00"] += 1
            print("entregas por dia (ultimos 14 dias): ccxp total / ccxp exatamente 18:00 | outros total / outros 18:00")
            for d in sorted(dia):
                c = dia[d]
                print(f"   {d}: ccxp {c['ccxp_entregas']:4} / {c['ccxp_as_18h00']:4} | outros {c['outros_entregas']:5} / {c['outros_as_18h00']:4}")
            PY
            python3 "$T/sonda.py" 2>&1 | sed -E 's/[A-Z]{4}[A-Z0-9]{8,}/***/g' || true
            echo; echo '== timers'; systemctl list-timers --all --no-pager | grep -iE 'logan|NEXT'
            echo '== cron da Total (atualizar_total_08)'; for f in $(find /home/projetos/atualizar_total_08 -maxdepth 2 -name '*.log' -newermt '-1 day' 2>/dev/null); do echo "$f alterado $(date -r "$f" '+%H:%M:%S') | linhas com erro/invalida na ultima hora: $(tail -n 400 "$f" | grep -ciE 'erro|invalid|falha')"; done
            rm -rf "$T"
