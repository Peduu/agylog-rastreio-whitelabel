# USO UNICO (so leitura): conferencia de pedidos recentes do CCXP (Logan e Total): transportadora x TMS. Saida CIFRADA
# (chave publica RSA; so o PC do Pedro tem a chave privada) - o log publico nao mostra pedidos. Nao grava nada. Apagar depois do uso.
name: "Uso unico - Conferencia de pedidos recentes (Logan e Total)"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Conferencia so leitura (VPS, saida cifrada)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 12m
          script: |
            set -euo pipefail
            T=$(mktemp -d)
            mkdir -p "$T/b"
            cat > "$T/pub.pem" <<'CHAVE'
            -----BEGIN PUBLIC KEY-----
            MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAj8+bHYHGa1BFR8wTnLWn
            o+vLEMavH0atNC4sddw4Ze278Jw/T8rn7FxrN6emJUgMj9p342h878s0i68x2904
            9Hfmr8wbAsX/QRqbO4kGXuXMJ6qK9nod004Fs+RL8r8t2yhtJ5NXQuDiNFVJM1MW
            Cg+ZwwDAu7rOAaVQAn69jsP7Zg7qiEEUdzgv5oGDg2xolk9CEPSEUScxFYaZSIRI
            SA1iXqNOZ065WS6BMTSHXVqFGoqdkD4iOA9zCVsNjXIsP1eERs8rw5rDiYOd0P7y
            OLL6kL0Lnar8CwFBbF8+rpzsh8ZmWfJQACtwHMr7hQ1LOuyl2tF7Ro7k105uYjcc
            xh+amDeh7G0E41/Ok9JlZ9UktA9jjLxyL6d4IEybF6SXVLixK1V+WpvJy3VtgR+r
            u6iPbwu0FyRQHNIgjRhToEDudNI3R8iWlDBhI+6nR0UOH9NlDvWZRsMeBtZWB7I+
            JudhtNAl63DMQNwIbakD29E0zeTCoprpBJozQQjJ28G3AgMBAAE=
            -----END PUBLIC KEY-----
            CHAVE
            cat > "$T/sonda.py" <<'PY'
            import base64, json, re, sqlite3, sys, time, urllib.request
            from collections import Counter
            from datetime import datetime
            from pathlib import Path

            SAIDA = Path(sys.argv[1])
            CCXP = "15871195"


            def ler_env(caminho):
                env = {}
                for linha in open(caminho, encoding="utf-8", errors="replace"):
                    linha = linha.strip()
                    if linha and not linha.startswith("#") and "=" in linha:
                        k, v = linha.split("=", 1)
                        env[k.replace("export ", "").strip()] = v.strip().strip('"').strip("'")
                return env


            R = ler_env("/etc/rastreamento.env")
            L = ler_env("/home/projetos/atualizar_logan/.env")
            TMS_TOKEN = R.get("TMS_API_TOKEN", "")
            TMS_URL = R.get("TMS_API_URL") or "https://corellilog.tmselite.com/api/ocorrencias/ocorrencianotafiscaldepara"
            TOTAL_URL = "https://apis.totalexpress.com.br/ics-tracking-encomenda-lv/v1/tracking"
            AUTH_TOTAL = base64.b64encode(f"{R.get('TOTAL_EXPRESS_API_USER', '')}:{R.get('TOTAL_EXPRESS_API_PASSWORD', '')}".encode()).decode()
            LOGAN_URL = L.get("LOGAN_API_URL") or "https://endpoint.simexpress.com.br/logan/endpoint/consultar/"
            LOGAN_AUTH = L.get("SIMEXPRESS_AUTHORIZATION_CODE", "")


            def post(url, corpo, headers, timeout=40):
                h = {"Content-Type": "application/json", "Accept": "application/json", "User-Agent": "AgyLog-Rastreamento/1.0"}
                h.update(headers)
                req = urllib.request.Request(url, data=json.dumps(corpo).encode(), headers=h)
                try:
                    with urllib.request.urlopen(req, timeout=timeout) as r:
                        return json.loads(r.read().decode("utf-8")), ""
                except Exception as exc:
                    return None, type(exc).__name__ + ": " + str(exc)[:160]


            CHAVE_OK = re.compile(r"(?i)codigo|ocorr|descr|status|data|hora|evento|situac|^dt|unidade|cidade|^uf$|previs")
            CHAVE_NAO = re.compile(r"(?i)nome|destinat|remet|cpf|cnpj|document|endere|logradouro|telefone|email|cep|assinat|recebedor|^rg$")


            def reduzir(o):
                if isinstance(o, dict):
                    r = {}
                    for k, v in o.items():
                        if CHAVE_NAO.search(str(k)):
                            continue
                        if isinstance(v, (dict, list)):
                            x = reduzir(v)
                            if x:
                                r[k] = x
                        elif CHAVE_OK.search(str(k)):
                            r[k] = v[:120] if isinstance(v, str) else v
                    return r
                if isinstance(o, list):
                    return [x for x in (reduzir(i) for i in o[:80]) if x]
                return None


            def so_digitos(v):
                return re.sub(r"\D", "", str(v or ""))


            p = sqlite3.connect("file:/home/rastreamento/database.db?mode=ro", uri=True)


            def cnpj_de(pedido):
                row = p.execute("SELECT cnpj_cliente FROM rastreios WHERE codigo = ?", (pedido,)).fetchone()
                return row[0] if row else None


            def badge_de(pedido):
                try:
                    row = p.execute("SELECT status_badge FROM rastreios WHERE codigo = ?", (pedido,)).fetchone()
                    return row[0] if row else None
                except Exception:
                    return None


            def tms(pedido, cnpj):
                for campo in ("listaPedidos", "listaNotasFiscais"):
                    d, _ = post(TMS_URL, {"cnpjEmbarcador": cnpj, campo: [pedido]}, {"Authorization": f"Bearer {TMS_TOKEN}"})
                    if d and not d.get("flagErro") and isinstance(d.get("listaResultados"), list) and d["listaResultados"]:
                        return reduzir(d["listaResultados"])
                return []


            saida = {"agora_servidor": datetime.now().isoformat(timespec="seconds")}

            # ---------------- Logan ----------------
            st = sqlite3.connect("file:/home/projetos/atualizar_logan/ocoren_logan_tms/runtime/state/processor_state.sqlite3?mode=ro", uri=True)
            rows = st.execute("SELECT event_key, remote_name, delivery_code, IFNULL(proof_url, ''), IFNULL(sent_to_tms_at, '') "
                              "FROM processed_events ORDER BY sent_to_tms_at DESC LIMIT 6000").fetchall()
            saida["logan_ultimos_envios_formato"] = [r[4] for r in rows[:3]]
            por_hora = Counter()
            for chave, remoto, pedido, prova, quando in rows:
                cat = "recuperacao" if re.search(r"(?i)recov|recup|dce_rec", remoto or "") else "arquivo"
                por_hora[(quando[:13], cat)] += 1
            saida["logan_envios_por_hora"] = sorted([f"{h} {c}: {n}" for (h, c), n in por_hora.items() if h >= "2026-10-18"])
            saida["logan_tipos_remote_name"] = Counter(re.sub(r"\d", "9", r[1] or "")[:40] for r in rows[:2000]).most_common(8)

            amostra_logan, vistos = [], set()
            for chave, remoto, pedido, prova, quando in rows:
                pedido = (pedido or "").strip().upper()
                if not pedido or pedido in vistos:
                    continue
                vistos.add(pedido)
                cnpj = cnpj_de(pedido)
                if not cnpj or not so_digitos(cnpj).startswith(CCXP):
                    continue
                amostra_logan.append(pedido)
                if len(amostra_logan) >= 18:
                    break

            saida["logan"] = []
            for pedido in amostra_logan:
                cnpj = cnpj_de(pedido)
                envios = [{"evento": r[0].split("|", 2)[-1] if r[0] else "", "enviado_em": r[4],
                           "via": "recuperacao" if re.search(r"(?i)recov|recup|dce_rec", r[1] or "") else "arquivo"}
                          for r in st.execute("SELECT event_key, remote_name, delivery_code, proof_url, sent_to_tms_at FROM processed_events "
                                              "WHERE UPPER(delivery_code) = ? ORDER BY sent_to_tms_at", (pedido,)).fetchall()]
                lg, erro = post(LOGAN_URL, {"Nr_Pedido": pedido, "Danfe": ""}, {"Authorization": LOGAN_AUTH})
                saida["logan"].append({"pedido": pedido, "envios_ao_tms": envios, "logan_api": reduzir(lg), "logan_erro": erro,
                                       "tms": tms(pedido, cnpj), "badge_portal": badge_de(pedido)})
                time.sleep(1.5)

            # ---------------- Total ----------------
            recentes = []
            for codigo, cnpj in p.execute("SELECT codigo, cnpj_cliente FROM rastreios ORDER BY id DESC LIMIT 6000"):
                if so_digitos(cnpj).startswith(CCXP) and codigo:
                    recentes.append(codigo.strip().upper())
                if len(recentes) >= 600:
                    break
            saida["total_consultados"] = len(recentes)
            achados, erros_total = {}, []
            for i in range(0, len(recentes), 30):
                lote = recentes[i:i + 30]
                d, erro = post(TOTAL_URL, {"pedidos": lote, "comprovanteEntrega": False}, {"Authorization": "Basic " + AUTH_TOTAL})
                if erro:
                    erros_total.append(erro)
                for e in (d or {}).get("data") or []:
                    if isinstance(e, dict) and e.get("tracking"):
                        achados[str(e.get("pedido") or "").upper()] = e
                time.sleep(1)
            saida["total_erros"] = erros_total[:5]
            saida["total_achados"] = len(achados)


            def ult_data_total(e):
                melhor = ""
                for ev in e.get("tracking") or []:
                    t = str(ev.get("data") or "")
                    try:
                        t = datetime.strptime(t[:19].replace("T", " "), "%Y-%m-%d %H:%M:%S").isoformat()
                    except ValueError:
                        try:
                            t = datetime.strptime(t[:16], "%d/%m/%Y %H:%M").isoformat()
                        except ValueError:
                            pass
                    melhor = max(melhor, t)
                return melhor


            ordem = sorted(achados.items(), key=lambda kv: ult_data_total(kv[1]), reverse=True)
            saida["total"] = []
            for pedido, e in ordem[:12]:
                saida["total"].append({"pedido": pedido, "total_ultimo": ult_data_total(e), "total_api": reduzir(e.get("tracking")),
                                       "tms": tms(pedido, cnpj_de(pedido)), "badge_portal": badge_de(pedido)})

            SAIDA.mkdir(parents=True, exist_ok=True)
            (SAIDA / "conferencia.json").write_text(json.dumps(saida, ensure_ascii=False, indent=1, default=str), encoding="utf-8")
            print("amostra logan:", len(saida["logan"]), "| total achados:", len(achados), "| amostra total:", len(saida["total"]),
                  "| erros total:", len(erros_total))
            PY
            python3 "$T/sonda.py" "$T/b" 2> "$T/b/erro_python.txt" || echo "sonda python saiu com erro (detalhe so dentro do pacote cifrado)"
            (systemctl list-timers --all --no-pager | grep -iE 'logan|NEXT'; systemctl show ocoren-logan-recuperacao.service -p Result -p ExecMainStartTimestamp -p ExecMainExitTimestamp; systemctl show ocoren-logan-tms.service -p ActiveState -p SubState -p ExecMainStartTimestamp) > "$T/b/timers.txt" 2>&1 || true
            P=/home/projetos/atualizar_logan/ocoren_logan_tms/runtime/logs
            tail -n 80 "$P/recuperacao.log" > "$T/b/recuperacao_tail.txt" 2>&1 || true
            tail -n 80 "$P/processor.log" > "$T/b/processor_tail.txt" 2>&1 || true
            for f in $(find /home/projetos/atualizar_total_08 -maxdepth 2 -name '*.log' -newermt '-1 day' 2>/dev/null); do echo "== $f"; tail -n 300 "$f" | grep -viE 'senha|password|token|bearer|authorization' | tail -n 60; done > "$T/b/total08_logs.txt" 2>&1 || true
            tar -czf "$T/pacote.tgz" -C "$T/b" .
            KEY=$(openssl rand -hex 32)
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$T/pacote.tgz" -out "$T/pacote.enc" -pass "pass:$KEY"
            printf '%s' "$KEY" | openssl pkeyutl -encrypt -pubin -inkey "$T/pub.pem" -out "$T/chave.enc"
            echo CHAVE_INICIO; base64 -w0 "$T/chave.enc"; echo; echo CHAVE_FIM
            echo DADOS_INICIO; base64 -w 900 "$T/pacote.enc"; echo DADOS_FIM
            rm -rf "$T"
