# USO UNICO (so leitura): estado da rotina Logan->TMS (/home/projetos/atualizar_logan, timer ocoren-logan-tms): arquivos,
# nomes das variaveis (sem valores), unidade systemd e journal/logs mascarados. Nao grava nada. Apagar depois do uso.
name: "Uso unico - Sonda da Logan (rotina Logan para TMS)"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sonda so leitura na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -uo pipefail
            mask() { sed -E 's/[0-9]{5,}/99999/g; s/\b[A-Z0-9]{10,}\b/***/g; s/(senha|password|pass|token|secret|chave|key)([^A-Za-z0-9]{1,3})[^ ,;"]+/\1\2<oculto>/Ig'; }
            D=/home/projetos/atualizar_logan
            echo "== arquivos de $D (sem .bak)"
            ls -la "$D" 2>/dev/null | grep -v "\.bak" | awk '{print "  " $6, $7, $8, $9}'
            ls -la "$D/ocoren_logan_tms" 2>/dev/null | grep -v "\.bak" | awk '{print "  [pkg] " $6, $7, $8, $9}'
            echo "== nomes das variaveis do .env (sem valores)"
            sed -E 's/=.*//' "$D/.env" 2>/dev/null | grep -v '^#' | sed 's/^/  /'
            echo "== unidade systemd"
            systemctl cat ocoren-logan-tms.service 2>/dev/null | grep -vE "^#|^$" | mask | sed 's/^/  /'
            systemctl cat ocoren-logan-tms.timer 2>/dev/null | grep -E "OnCalendar|OnUnitActiveSec|OnBootSec" | sed 's/^/  /'
            systemctl list-timers ocoren-logan-tms.timer --all --no-pager 2>/dev/null | sed 's/^/  /' | head -3
            echo "== ultimas execucoes (journal, mascarado)"
            journalctl -u ocoren-logan-tms.service --since "2026-10-14" --no-pager 2>/dev/null | grep -viE "^-- " | tail -60 | mask | cut -c1-200 | sed 's/^/  /'
            echo "== resumo por dia de linhas com erro no journal desde 10/10"
            journalctl -u ocoren-logan-tms.service --since "2026-10-10" --no-pager -o short-iso 2>/dev/null | grep -iE "erro|error|fail|falh|exception|traceback|refused|denied|login|530|timed out|timeout" | cut -c1-10 | sort | uniq -c | sed 's/^/  /'
            echo "== logs da rotina (arquivos *.log*, ultimas 15 linhas mascaradas)"
            for f in $(find "$D" -maxdepth 3 -name "*.log" -newermt "2026-10-01" 2>/dev/null | head -5); do
              echo "  -- $f ($(wc -l < "$f") linhas, alterado $(date -r "$f" '+%Y-%m-%d %H:%M'))"
              tail -15 "$f" | mask | cut -c1-200 | sed 's/^/     /'
            done
