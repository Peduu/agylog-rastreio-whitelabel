# USO UNICO (so leitura): confere as rotinas Total->TMS do servidor (/home/projetos/atualizar_total*): de onde vem o login da
# Total (so tamanho e se e igual ao segredo novo, nunca o valor) e os erros do cron.log (numeros mascarados). Nao grava nada.
# Apagar este arquivo depois do uso.
name: "Uso unico - Sonda 6 da Total Express (rotinas Total para TMS)"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sonda so leitura na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -euo pipefail
            python3 - <<'PY'
            import json, os, re
            from collections import Counter

            env = {}
            for linha in open("/etc/rastreamento.env", encoding="utf-8", errors="replace"):
                linha = linha.strip()
                if linha and not linha.startswith("#") and "=" in linha:
                    k, v = linha.split("=", 1)
                    env[k.strip()] = v.strip().strip('"').strip("'")
            USER_NOVO, SENHA_NOVA = env.get("TOTAL_EXPRESS_API_USER", ""), env.get("TOTAL_EXPRESS_API_PASSWORD", "")


            def mascara(t):
                t = re.sub(r"\d{5,}", lambda m: "9" * len(m.group(0)), t)
                t = re.sub(r"\b[A-Z0-9]{10,}\b", lambda m: m.group(0)[:3] + "***", t)
                return t


            def caminhos(obj, prefixo=""):
                if isinstance(obj, dict):
                    for k, v in obj.items():
                        yield from caminhos(v, f"{prefixo}.{k}" if prefixo else str(k))
                elif isinstance(obj, list):
                    for i, v in enumerate(obj[:3]):
                        yield from caminhos(v, f"{prefixo}[{i}]")
                else:
                    yield prefixo, obj


            for pasta in ("/home/projetos/atualizar_total", "/home/projetos/atualizar_total_08", "/home/projetos/atualizar_total_MQF"):
                print(f"===== {pasta}")
                if not os.path.isdir(pasta):
                    print("  (nao existe)")
                    continue
                print("  arquivos:", sorted(f for f in os.listdir(pasta) if not f.startswith(".") and ".bak" not in f)[:25])
                r = os.path.join(pasta, "regras.json")
                if os.path.exists(r):
                    try:
                        cfg = json.load(open(r, encoding="utf-8"))
                        for cam, val in caminhos(cfg):
                            if re.search(r"user|usuario|login|senha|password|pass|auth|token", cam, re.I):
                                s = str(val)
                                print(f"  regras.json {cam}: tamanho {len(s)} | igual ao usuario novo={s == USER_NOVO} | igual a senha nova={s == SENHA_NOVA}")
                    except Exception as e:
                        print("  regras.json: erro ao ler", type(e).__name__)
                else:
                    print("  sem regras.json")
                for nome in ("integracao_total_tms.py",):
                    f = os.path.join(pasta, nome)
                    if os.path.exists(f):
                        for n, linha in enumerate(open(f, encoding="utf-8", errors="replace"), 1):
                            if re.search(r"regras|senha|password|auth|getenv|environ|\.env", linha, re.I):
                                linha = re.sub(r"([\"'])[^\"']{6,}\1", r"\1<texto>\1", linha.strip())
                                print(f"  {nome}:{n}: {linha[:140]}")
                log = os.path.join(pasta, "cron.log")
                if os.path.exists(log):
                    linhas = open(log, encoding="utf-8", errors="replace").read().splitlines()
                    erros = Counter()
                    for l in linhas:
                        m = re.search(r"(20\d\d-\d\d-\d\d)", l)
                        if re.search(r"autentica|invalid|401|400|erro|error|exception|traceback|falh", l, re.I):
                            erros[(m.group(1) if m else "?", mascara(l)[:90])] += 1
                    print("  cron.log: linhas", len(linhas))
                    print("  erros por dia (ultimos 12 tipos):")
                    for (dia, msg), n in sorted(erros.items())[-12:]:
                        print(f"    {dia} x{n}: {msg}")
                    print("  ultimas 8 linhas:")
                    for l in linhas[-8:]:
                        print("    " + mascara(l)[:160])
            PY
