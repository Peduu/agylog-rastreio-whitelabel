# USO UNICO (so leitura): confere a rotina Logan->TMS depois do conserto (journal e processor.log mascarados). Nao grava nada.
# Apagar este arquivo depois do uso.
name: "Uso unico - Conferencia da rotina Logan"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Conferencia so leitura na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -uo pipefail
            D=/home/projetos/atualizar_logan
            P="$D/ocoren_logan_tms"
            mask() { sed -E 's/[0-9]{5,}/99999/g; s/[A-Z0-9]{9,}/***/g'; }
            echo "agora no servidor: $(date '+%Y-%m-%d %H:%M:%S %z')"
            systemctl show ocoren-logan-tms.service -p ActiveState -p SubState -p ExecMainStartTimestamp | sed 's/^/  /'
            journalctl -u ocoren-logan-tms.service -n 12 --no-pager -o short-iso | mask | cut -c1-170 | sed 's/^/  j /'
            echo "patch no main.py: $(grep -c 'Claude 19/10/2026' "$P/main.py") marcas | gerador: $(test -f "$P/gerar_lista_recuperacao.py" && echo sim || echo nao)"
            grep -E "^(DCE_RECOVERY_ORDERS_FILE|DCE_RECOVERY_BATCH_SIZE)=" "$D/.env" | sed 's/^/  /'
            echo "lista: $(wc -l < "$D/pedidos_recuperacao.txt" 2>/dev/null || echo 0) pedidos | alterada $(date -r "$D/pedidos_recuperacao.txt" '+%H:%M' 2>/dev/null)"
            L="$P/runtime/logs/processor.log"
            awk '$0 >= "2026-10-19 10:24:44"' "$L" > /tmp/novo_logan.log 2>/dev/null || true
            echo "== processor.log desde a troca: $(wc -l < /tmp/novo_logan.log) linhas | ultima: $(tail -1 /tmp/novo_logan.log | cut -c1-19)"
            for padrao in "Inicio do processamento" "Lista da recuperacao por pedido atualizada" "Recuperação enviada ao TMS" "Recuperação já enviada" "Arquivo finalizado" "CNPJ do embarcador nao encontrado" "Linha enviada" "Erro no envio ao TMS" "cooldown" "Codigo SimExpress sem DeXPara" "Processando arquivo"; do
              echo "   $(grep -c "$padrao" /tmp/novo_logan.log || true) x $padrao"
            done
            grep -E "Inicio do processamento|Lista da recuperacao|Arquivo finalizado" /tmp/novo_logan.log | tail -6 | mask | cut -c1-190 | sed 's/^/   /'
            rm -f /tmp/novo_logan.log
