# USO UNICO: senha nova da Total na rotina Total->TMS da conta MQF (/home/projetos/atualizar_total_MQF, regras.json).
# Copia o segredo TOTAL_MQF_API_PASSWORD (gravado pelo Pedro; TOTAL_MQF_API_USER opcional: se vier e nao for o
# usuario da rotina MQF, recusa) e sobe a janela de 15 para 30 dias, para recuperar os
# eventos desde 11/10 (quando a senha parou). Sem "TROCAR" so relata. Backup do regras.json antes. Depois espera a
# proxima rodada do cron: se a Total ainda recusar a senha, volta o backup sozinho.
# Repo PUBLICO: o log so mostra contagens. Apagar este arquivo depois do uso.
name: "Uso unico - Senha nova da Total na rotina MQF"

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Vazio = so relata. Digite TROCAR para gravar (com backup do regras.json antes)"
        required: false
        default: ""
        type: string

jobs:
  trocar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trocar a senha da Total na rotina MQF (VPS)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3 (fixado: recebe a senha da Total)
        env:
          TOTAL_USER: ${{ secrets.TOTAL_MQF_API_USER }}
          TOTAL_SENHA: ${{ secrets.TOTAL_MQF_API_PASSWORD }}
          CONFIRMAR: ${{ inputs.confirmar }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: TOTAL_USER,TOTAL_SENHA,CONFIRMAR
          command_timeout: 25m
          script: |
            set -euo pipefail
            python3 - <<'PY'
            import json, os, re, shutil, sys, tempfile, time
            from datetime import datetime
            from pathlib import Path

            PASTA = Path("/home/projetos/atualizar_total_MQF")
            REGRAS = PASTA / "regras.json"
            LOG = PASTA / "cron.log"
            JANELA = 30
            gravar = os.environ.get("CONFIRMAR", "").strip() == "TROCAR"
            senha = os.environ.get("TOTAL_SENHA", "")
            usuario = os.environ.get("TOTAL_USER", "").strip()


            def auth_invalida(texto):
                return sum(1 for l in texto.splitlines() if re.search(r"(?i)autentica(\\u00e7\\u00e3|ca|çã)o inv(\\u00e1|a|á)lida", l))


            def escrever(conteudo, st):
                with tempfile.NamedTemporaryFile("w", encoding="utf-8", dir=PASTA, prefix=".regras-", delete=False) as tmp:
                    tmp.write(conteudo)
                os.chown(tmp.name, st.st_uid, st.st_gid)
                os.chmod(tmp.name, st.st_mode & 0o7777)
                os.replace(tmp.name, REGRAS)


            if not senha:
                sys.exit("ERRO: segredo TOTAL_MQF_API_PASSWORD vazio. Nada foi alterado.")
            if not re.fullmatch(r"[!-~]{4,}", senha):
                sys.exit("ERRO: senha com espaco ou caractere inesperado (colou certo?). Nada foi alterado.")
            bruto = REGRAS.read_text(encoding="utf-8")
            cfg = json.loads(bruto)
            total = cfg.get("total") if isinstance(cfg, dict) else None
            if not isinstance(total, dict) or "senha" not in total or "usuario" not in total:
                sys.exit("ERRO: regras.json sem total.usuario/total.senha. Nada foi alterado.")
            periodo = total.get("periodo") if isinstance(total.get("periodo"), dict) else {}
            ultimas = LOG.read_text(encoding="utf-8", errors="replace").splitlines()[-60:] if LOG.exists() else []
            print("rotina:", PASTA)
            # so booleanos: nenhum usuario ou senha vai para o log
            try:
                ecom = json.loads(Path("/home/projetos/atualizar_total_08/regras.json").read_text(encoding="utf-8"))["total"]
            except Exception:
                ecom = {}
            if usuario:
                print("usuario informado = usuario da rotina MQF:", usuario == total["usuario"])
                print("usuario informado = usuario da rotina do ecom (_08):", usuario == ecom.get("usuario"))
            print("senha informada = senha atual do ecom (_08):", senha == ecom.get("senha"))
            # Diagnostico somente leitura: usuario cifrado para chave temporaria local.
            if usuario and usuario != total["usuario"]:
                import base64, subprocess
                with tempfile.NamedTemporaryFile("wb", delete=False) as pub:
                    pub.write(base64.b64decode(""))
                try:
                    cifrado = subprocess.run(["openssl", "pkeyutl", "-encrypt", "-pubin", "-inkey", pub.name, "-pkeyopt", "rsa_padding_mode:oaep", "-pkeyopt", "rsa_oaep_md:sha256"], input=json.dumps({"usuario_mqf": total["usuario"]}).encode(), capture_output=True)
                    if cifrado.returncode:
                        sys.exit("Falha na cifragem do diagnostico; nenhuma alteracao.")
                    print("AUDIT_CIPHER:" + base64.b64encode(cifrado.stdout).decode())
                finally:
                    os.unlink(pub.name)
            if usuario and usuario != total["usuario"]:
                sys.exit("ERRO: o usuario informado nao e o da rotina MQF; nao troco a senha de outra conta. Nada foi alterado.")
            print("senha do arquivo = senha nova:", total["senha"] == senha)
            print("janela atual (dias):", periodo.get("ultimos_dias"))
            print("'Autenticacao invalida' nas ultimas 60 linhas do log:", auth_invalida("\n".join(ultimas)))
            if total["senha"] == senha:
                print("A senha ja e a nova. Nada a fazer.")
                gravar = False
            elif not gravar:
                print("SO RELATO: nada gravado. Para trocar, rode de novo com confirmar = TROCAR.")

            if gravar:
                m = re.search(r"\n([ \t]+)\"", bruto)
                recuo = len(m.group(1)) if m else 2
                total["senha"] = senha
                if isinstance(total.get("periodo"), dict) and int(total["periodo"].get("ultimos_dias") or 0) < JANELA:
                    total["periodo"]["ultimos_dias"] = JANELA
                novo = json.dumps(cfg, ensure_ascii=False, indent=recuo) + ("\n" if bruto.endswith("\n") else "")
                assert json.loads(novo)["total"]["senha"] == senha
                backup = REGRAS.with_name(f"regras.json.bak-{datetime.now():%Y%m%d-%H%M%S}-senha-total-mqf")
                shutil.copy2(REGRAS, backup)
                st = REGRAS.stat()
                escrever(novo, st)
                print("backup:", backup)
                print("senha trocada (valor nao exibido); janela:", total["periodo"].get("ultimos_dias"), "dias")

                # espera a proxima rodada do cron (a cada 10 min); se a Total ainda recusar, volta o backup
                tamanho = LOG.stat().st_size if LOG.exists() else 0
                fim = time.time() + 22 * 60
                resultado = None
                while time.time() < fim:
                    time.sleep(30)
                    if LOG.exists() and LOG.stat().st_size > tamanho:
                        with LOG.open(encoding="utf-8", errors="replace") as f:
                            f.seek(tamanho)
                            novo_log = f.read()
                        if auth_invalida(novo_log):
                            resultado = "recusada"
                            break
                        if "Processamento finalizado" in novo_log:
                            resultado = "ok"
                            break
                if resultado == "recusada":
                    shutil.copy2(backup, REGRAS)
                    sys.exit("A Total RECUSOU a senha nova (Autenticacao invalida). Backup restaurado; nada mudou.")
                if resultado == "ok":
                    print("== rodada do cron depois da troca: senha aceita pela Total")
                    for l in novo_log.splitlines():
                        if "Processamento finalizado" in l:
                            print("   " + l.strip()[-90:])
                else:
                    print("AVISO: a rotina nao terminou uma rodada em 22 minutos; a senha ficou gravada. Conferir depois.")
            PY
