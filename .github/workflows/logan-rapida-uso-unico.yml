# USO UNICO: deixa a segunda opcao Logan->TMS (recuperacao por pedido) mais rapida: lista com os N pedidos mais recentes ainda
# nao entregues (padrao 1200, antes 3000) e lote maior por rodada (padrao 40, antes 30) -> cada pedido reconsultado a cada ~1 h.
# Sem "APLICAR" so relata (contagens, sem pedidos). Backup antes; se a rodada de teste falhar, restaura sozinho.
# Apagar este arquivo depois do uso.
name: "Uso unico - Segunda opcao Logan mais rapida"

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Vazio = so relata. Digite APLICAR para gravar"
        required: false
        default: ""
        type: string
      limite:
        description: "Pedidos na lista da recuperacao"
        required: false
        default: "1200"
        type: string
      lote:
        description: "Pedidos por rodada (a cada 2 min, maximo 50)"
        required: false
        default: "40"
        type: string

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ajuste na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
          LIMITE: ${{ inputs.limite }}
          LOTE: ${{ inputs.lote }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: CONFIRMAR,LIMITE,LOTE
          command_timeout: 12m
          script: |
            set -uo pipefail
            D=/home/projetos/atualizar_logan
            P="$D/ocoren_logan_tms"
            G="$P/gerar_lista_recuperacao.py"
            U=/etc/systemd/system/ocoren-logan-recuperacao.service
            C="$P/runtime/state/dce_recovery_cursor.txt"
            LISTA="$D/pedidos_recuperacao.txt"
            LR="$P/runtime/logs/recuperacao.log"
            mask() { sed -E 's/[0-9]{5,}/99999/g; s/[A-Z0-9]{9,}/***/g'; }
            case "$LIMITE" in ''|*[!0-9]*) echo "ERRO: limite invalido"; exit 1;; esac
            case "$LOTE" in ''|*[!0-9]*) echo "ERRO: lote invalido"; exit 1;; esac
            if [ "$LIMITE" -lt 300 ] || [ "$LIMITE" -gt 5000 ] || [ "$LOTE" -lt 10 ] || [ "$LOTE" -gt 50 ]; then echo "ERRO: fora da faixa"; exit 1; fi
            echo "agora: $(date '+%F %T') | pedido: limite=$LIMITE lote=$LOTE"
            echo "limite hoje: $(grep -o 'LOGAN_RECUPERACAO_MAX_PEDIDOS", "[0-9]*' "$G" || echo 'NAO ENCONTRADO')"
            echo "lote hoje: $(grep -o 'DCE_RECOVERY_BATCH_SIZE=[0-9]*' "$U" || echo 'NAO ENCONTRADO')"
            echo "lista hoje: $(wc -l < "$LISTA") pedidos | cursor: $(cat "$C" 2>/dev/null || echo 0)"
            cd "$D"
            python3 - <<'PY'
            import json, os, re, sqlite3, sys
            from collections import Counter
            from datetime import datetime
            os.environ["LOGAN_RECUPERACAO_MAX_PEDIDOS"] = "100000"
            sys.path.insert(0, "/home/projetos/atualizar_logan")
            from ocoren_logan_tms import gerar_lista_recuperacao as g
            completa = g.montar_lista()
            limite = int(os.environ.get("LIMITE", "1200"))
            print("candidatos (nao entregues, com CNPJ), sem limite:", len(completa))
            est = json.loads(g.ENVIOS.read_text(encoding="utf-8"))
            ultimos = [v for v in list(est.values())[-30:] if isinstance(v, dict)]
            print("registro de envios a Logan:", len(est), "entradas | campos:", sorted({k for v in ultimos for k in v})[:12])
            p = sqlite3.connect("file:/home/rastreamento/database.db?mode=ro", uri=True)
            hoje = datetime.now()
            def quando(cod):
                row = p.execute("SELECT data_cadastro_portal, data_postagem FROM rastreios WHERE codigo = ?", (cod,)).fetchone()
                for v in row or []:
                    s = str(v or "").strip()
                    for fmt, n in (("%Y-%m-%d", 10), ("%d/%m/%Y", 10)):
                        try:
                            return datetime.strptime(s[:n], fmt)
                        except ValueError:
                            pass
                return None
            def faixa(cod):
                d = quando(cod)
                if not d:
                    return "sem data"
                dias = (hoje - d).days
                return "0-7d" if dias <= 7 else "8-15d" if dias <= 15 else "16-30d" if dias <= 30 else "31-60d" if dias <= 60 else "+60d"
            for nome, parte in (("posicoes 1-" + str(limite), completa[:limite]), ("posicoes " + str(limite + 1) + "-3000", completa[limite:3000]),
                                ("depois de 3000", completa[3000:])):
                c = Counter(faixa(x) for x in parte)
                print(f"   {nome:22} ({len(parte):5}): " + " | ".join(f"{k} {c[k]}" for k in ("0-7d", "8-15d", "16-30d", "31-60d", "+60d", "sem data")))
            PY
            if [ "${CONFIRMAR:-}" != "APLICAR" ]; then echo "SO RELATO: nada foi alterado. Rode com confirmar = APLICAR."; exit 0; fi

            B="$D/backups-claude-$(date +%Y%m%d-%H%M%S)-recuperacao-rapida"
            mkdir -p "$B"
            cp -p "$G" "$U" "$LISTA" "$B/" || { echo "ERRO no backup; nada foi alterado"; exit 1; }
            cp -p "$C" "$B/" 2>/dev/null || true
            echo "backup: $B"
            restaura() {
              echo "RESTAURANDO o backup"
              cp -p "$B/gerar_lista_recuperacao.py" "$G"
              cp -p "$B/ocoren-logan-recuperacao.service" "$U"
              cp -p "$B/pedidos_recuperacao.txt" "$LISTA"
              [ -f "$B/dce_recovery_cursor.txt" ] && cp -p "$B/dce_recovery_cursor.txt" "$C"
              systemctl daemon-reload
            }
            python3 - "$G" "$U" <<'PY' || { restaura; exit 1; }
            import os, re, sys
            g, u = sys.argv[1], sys.argv[2]
            limite, lote = os.environ["LIMITE"], os.environ["LOTE"]
            a = open(g, encoding="utf-8").read()
            padrao = r'LIMITE = int\(os\.getenv\("LOGAN_RECUPERACAO_MAX_PEDIDOS", "\d+"\)\).*'
            if len(re.findall(padrao, a)) != 1:
                sys.exit("linha do limite nao encontrada")
            novo = f'LIMITE = int(os.getenv("LOGAN_RECUPERACAO_MAX_PEDIDOS", "{limite}"))  # Claude 19/10/2026: era 3000; ciclo de ~1 h'
            with open(g, "w", encoding="utf-8") as f:
                f.write(re.sub(padrao, lambda m: novo, a))
            b = open(u, encoding="utf-8").read()
            if len(re.findall(r"(?m)^Environment=DCE_RECOVERY_BATCH_SIZE=\d+$", b)) != 1:
                sys.exit("lote do servico nao encontrado")
            with open(u, "w", encoding="utf-8") as f:
                f.write(re.sub(r"(?m)^Environment=DCE_RECOVERY_BATCH_SIZE=\d+$", "Environment=DCE_RECOVERY_BATCH_SIZE=" + lote, b))
            print("arquivos alterados")
            PY
            python3 -m py_compile "$G" || { restaura; exit 1; }
            systemctl daemon-reload
            touch -d '1 hour ago' "$LISTA"
            echo 0 > "$C"
            INICIO=$(date '+%Y-%m-%d %H:%M:%S')
            echo "== rodada de teste ($INICIO)"
            systemctl start ocoren-logan-recuperacao.service
            R=$(systemctl show ocoren-logan-recuperacao.service -p Result --value)
            TB=$(journalctl -u ocoren-logan-recuperacao.service --since "$INICIO" --no-pager 2>/dev/null | grep -c "Traceback" || true)
            echo "resultado: $R | tracebacks: $TB"
            if [ "$R" != "success" ] || [ "$TB" -gt 0 ]; then restaura; exit 1; fi
            awk -v t="$INICIO" '$0 >= t' "$LR" > /tmp/rec_novo.log
            for padrao in "Lista da recuperacao por pedido atualizada" "Iniciando recupera" "Recuperação enviada ao TMS" "Recuperação já enviada" "Resposta TMS" "cooldown" "sem DeXPara" "Erro na recupera" "Recuperacao por pedido concluida"; do
              echo "   $(grep -c "$padrao" /tmp/rec_novo.log || true) x $padrao"
            done
            grep -E "Lista da recuperacao|Iniciando recupera" /tmp/rec_novo.log | tail -3 | mask | cut -c1-170 | sed 's/^/   /'
            rm -f /tmp/rec_novo.log
            echo "lista nova: $(wc -l < "$LISTA") pedidos | cursor: $(cat "$C")"
            echo "lote no servico: $(grep -o 'DCE_RECOVERY_BATCH_SIZE=[0-9]*' "$U")"
            systemctl list-timers ocoren-logan-recuperacao.timer --no-pager | head -2 | sed 's/^/   /'
            {
              echo "19/10/2026 (Claude): segunda opcao Logan mais rapida."
              echo "gerar_lista_recuperacao.py: LIMITE padrao 3000 -> $LIMITE (pedidos mais recentes ainda nao entregues)."
              echo "ocoren-logan-recuperacao.service: DCE_RECOVERY_BATCH_SIZE 30 -> $LOTE (a cada 2 min)."
              echo "Desfazer: copiar os arquivos deste backup de volta e rodar systemctl daemon-reload."
            } > "$B/LEIA-ME.txt"
            echo "APLICADO."
