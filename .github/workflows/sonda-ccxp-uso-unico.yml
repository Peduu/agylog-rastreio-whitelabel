# USO UNICO (so leitura): CCXP nao reflete status - pedidos recentes do CCXP na Total e na Logan x TMS + saude das rotinas.
# Saida CIFRADA (chave publica RSA; so o PC do Pedro tem a privada). Nao grava nada. Apagar depois do uso.
name: "Uso unico - Sonda CCXP status"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sonda so leitura (VPS, saida cifrada)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 13m
          script: |
            set -uo pipefail
            T=$(mktemp -d)
            mkdir -p "$T/b"
            cat > "$T/pub.pem" <<'CHAVE'
            -----BEGIN PUBLIC KEY-----
            MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEArhx86eg9MSescrTAAfi0
            kWVIpltk4TVtm+37RSUQPGYtFh2xW8CBabQ4/XxPGaSbViubE8GrIH2l8bs5oYpq
            LgYxpZ8gvfqTFs7LSHAnsvGMv7WSVBrCkPtkKrALrxP+NycK57rG+HEPIYVyIKMa
            s2K6jyZtYwSOg3NS2/++a7PM7Sgh/OR6H8bYxgrvvdQzAJdQm6CsRJcqc2hINo4I
            tz1Krz2pQDrF6NEYd3tJVWzx9LOpjBXmTjF1nucJ2zWc26L5zoPagHoNIiZdOdar
            eDcqBp3mQXS8C9EKb3bJ0JXfelRwjc3Fd3r/zEwaWz1FDgeTGXBxduQHc6lz9Y8Q
            vFmcBOLeIExmr4x4HSe+cclUambZzGabNC3giMPqRPpi9HEla+4DO2Ba8FY9QUPr
            umLIwgn1LNCbb7LK2bzD0RAMSSfYWhj5xIQoLSKvyKMO7C88A/LUkJgXDlTL0mHD
            91j4A2htzBTquDospoDUH49ujaB83Lya+eApH1YcDC6JAgMBAAE=
            -----END PUBLIC KEY-----
            CHAVE
            cat > "$T/sonda.py" <<'PY'
            import base64, json, re, sqlite3, sys, time, urllib.request
            from collections import Counter
            from datetime import datetime, timedelta
            from pathlib import Path

            SAIDA = Path(sys.argv[1])
            CCXP = "15871195"
            agora = datetime.now()


            def ler_env(caminho):
                env = {}
                for linha in open(caminho, encoding="utf-8", errors="replace"):
                    linha = linha.strip()
                    if linha and not linha.startswith("#") and "=" in linha:
                        k, v = linha.split("=", 1)
                        env[k.replace("export ", "").strip()] = v.strip().strip('"').strip("'")
                return env


            R = ler_env("/etc/rastreamento.env")
            L = ler_env("/home/projetos/atualizar_logan/.env")
            TMS_URL = R.get("TMS_API_URL") or "https://corellilog.tmselite.com/api/ocorrencias/ocorrencianotafiscaldepara"
            AUTH_TOTAL = base64.b64encode(f"{R.get('TOTAL_EXPRESS_API_USER', '')}:{R.get('TOTAL_EXPRESS_API_PASSWORD', '')}".encode()).decode()


            def post(url, corpo, headers, timeout=40):
                h = {"Content-Type": "application/json", "Accept": "application/json", "User-Agent": "AgyLog-Rastreamento/1.0"}
                h.update(headers)
                try:
                    with urllib.request.urlopen(urllib.request.Request(url, data=json.dumps(corpo).encode(), headers=h), timeout=timeout) as r:
                        return json.loads(r.read().decode("utf-8")), ""
                except urllib.error.HTTPError as exc:
                    try:
                        corpo_erro = exc.read().decode("utf-8", "replace")[:200]
                    except Exception:
                        corpo_erro = ""
                    return None, f"HTTP {exc.code} {corpo_erro}"
                except Exception as exc:
                    return None, type(exc).__name__ + ": " + str(exc)[:120]


            def dt(v):
                s = str(v or "").strip().replace("T", " ")
                for fmt in ("%Y%m%d %H:%M:%S", "%Y-%m-%d %H:%M:%S", "%d/%m/%Y %H:%M:%S", "%d/%m/%Y %H:%M"):
                    try:
                        return datetime.strptime(s[:19], fmt)
                    except ValueError:
                        pass
                return None


            p = sqlite3.connect("file:/home/rastreamento/database.db?mode=ro", uri=True)


            def cnpj_de(pedido):
                row = p.execute("SELECT cnpj_cliente FROM rastreios WHERE codigo = ?", (pedido,)).fetchone()
                return row[0] if row else ""


            def tms(pedido, cnpj):
                erro = ""
                for campo in ("listaPedidos", "listaNotasFiscais"):
                    d, erro = post(TMS_URL, {"cnpjEmbarcador": cnpj, campo: [pedido]}, {"Authorization": f"Bearer {R.get('TMS_API_TOKEN', '')}"})
                    if d and not d.get("flagErro") and isinstance(d.get("listaResultados"), list) and d["listaResultados"]:
                        evs = sorted(d["listaResultados"], key=lambda o: dt(o.get("dtOcorrencia")) or datetime.min)
                        return [{"dt": o.get("dtOcorrencia"), "cod": o.get("codigoOcorrencia"), "desc": str(o.get("descricaoOcorrencia") or "")[:60]}
                                for o in evs[-4:]], ""
                    if d and d.get("flagErro"):
                        erro = "flagErro " + str(d.get("listaErros") or d.get("mensagem") or "")[:150]
                return [], erro


            saida = {"agora": agora.isoformat(timespec="seconds"), "total": [], "logan": []}
            resumo = Counter()

            # ---- Total ----
            recentes = []
            for codigo, cnpj in p.execute("SELECT codigo, cnpj_cliente FROM rastreios ORDER BY id DESC LIMIT 8000"):
                if re.sub(r"\D", "", str(cnpj or "")).startswith(CCXP) and codigo:
                    recentes.append(codigo.strip().upper())
                if len(recentes) >= 500:
                    break
            achados, erros_total = {}, Counter()
            for i in range(0, len(recentes), 30):
                d, erro = post("https://apis.totalexpress.com.br/ics-tracking-encomenda-lv/v1/tracking",
                               {"pedidos": recentes[i:i + 30], "comprovanteEntrega": False}, {"Authorization": "Basic " + AUTH_TOTAL})
                if erro:
                    erros_total[erro[:60]] += 1
                for e in (d or {}).get("data") or []:
                    if isinstance(e, dict) and e.get("tracking"):
                        achados[str(e.get("pedido") or "").upper()] = e
                time.sleep(0.8)
            saida["total_consultados"], saida["total_achados"], saida["total_erros"] = len(recentes), len(achados), dict(erros_total)


            def ult_total(e):
                evs = [(dt(ev.get("data")), ev) for ev in e.get("tracking") or [] if isinstance(ev, dict)]
                evs = [x for x in evs if x[0]]
                return max(evs, key=lambda x: x[0]) if evs else (None, {})


            ordem = sorted(achados.items(), key=lambda kv: ult_total(kv[1])[0] or datetime.min, reverse=True)
            for pedido, e in ordem[:35]:
                quando, ev = ult_total(e)
                t, erro = tms(pedido, cnpj_de(pedido))
                ut = dt(t[-1]["dt"]) if t else None
                if not t:
                    sit = "sem TMS"
                elif quando and ut and ut >= quando - timedelta(minutes=2):
                    sit = "em dia"
                elif quando and (agora - quando) < timedelta(minutes=25):
                    sit = "recente (<25 min)"
                else:
                    sit = "TMS ATRASADO"
                resumo["total: " + sit] += 1
                saida["total"].append({"pedido": pedido, "transp": [str(quando), ev.get("descricao")], "tms": t, "tms_erro": erro, "sit": sit})

            # ---- Logan ----
            envios = json.loads(Path("/home/projetos/totalexpress-shipment-api/runtime/simexpress-inbox-state.json").read_text(encoding="utf-8"))
            vistos = []
            for entrada in reversed(list(envios.values())):
                if not isinstance(entrada, dict):
                    continue
                for cod in reversed(entrada.get("enviados") or []):
                    cod = str(cod).strip().upper()
                    if cod and cod not in vistos and re.sub(r"\D", "", cnpj_de(cod)).startswith(CCXP):
                        vistos.append(cod)
                if len(vistos) >= 25:
                    break
            saida["logan_registro_campos"] = sorted({k for v in list(envios.values())[-5:] if isinstance(v, dict) for k in v})
            saida["logan_ultima_entrada"] = {k: (v if not isinstance(v, list) else len(v)) for k, v in list(envios.values())[-1].items()} if envios else {}
            for pedido in vistos[:25]:
                lg, erro = post(L.get("LOGAN_API_URL") or "https://endpoint.simexpress.com.br/logan/endpoint/consultar/",
                                {"Nr_Pedido": pedido, "Danfe": ""}, {"Authorization": L.get("SIMEXPRESS_AUTHORIZATION_CODE", "")})
                evs = [(dt(x.get("data")), x.get("situacao")) for x in ((lg or {}).get("tracking") or []) if isinstance(x, dict)]
                evs = [x for x in evs if x[0]]
                quando, desc = max(evs, key=lambda x: x[0]) if evs else (None, "")
                t, terro = tms(pedido, cnpj_de(pedido))
                ut = dt(t[-1]["dt"]) if t else None
                if erro:
                    sit = "Logan recusou"
                elif not evs:
                    sit = "Logan sem evento"
                elif not t:
                    sit = "sem TMS"
                elif ut and ut >= quando - timedelta(minutes=2):
                    sit = "em dia"
                else:
                    sit = "TMS ATRASADO"
                resumo["logan: " + sit] += 1
                saida["logan"].append({"pedido": pedido, "transp": [str(quando), desc], "logan_erro": erro[:120], "tms": t, "tms_erro": terro, "sit": sit})
                time.sleep(2.5)

            # ---- rotinas ----
            st = sqlite3.connect("file:/home/projetos/atualizar_logan/ocoren_logan_tms/runtime/state/processor_state.sqlite3?mode=ro", uri=True)
            saida["logan_ultimo_envio_tms"] = st.execute("SELECT MAX(sent_to_tms_at) FROM processed_events").fetchone()[0]
            saida["logan_envios_ultimas_3h"] = st.execute("SELECT COUNT(*) FROM processed_events WHERE sent_to_tms_at >= ?",
                                                         ((agora - timedelta(hours=3)).isoformat(timespec="seconds"),)).fetchone()[0]
            SAIDA.mkdir(parents=True, exist_ok=True)
            (SAIDA / "ccxp.json").write_text(json.dumps(saida, ensure_ascii=False, indent=1, default=str), encoding="utf-8")
            print("RESUMO:", dict(resumo))
            print("total: consultados", len(recentes), "| achados na Total", len(achados), "| erros", dict(erros_total))
            print("logan: ultimo envio ao TMS", saida["logan_ultimo_envio_tms"], "| envios nas ultimas 3h", saida["logan_envios_ultimas_3h"])
            PY
            python3 "$T/sonda.py" "$T/b" 2> "$T/b/erro_python.txt" | sed -E 's/[A-Z]{4}[A-Z0-9]{8,}/***/g' || echo 'sonda python com erro (detalhe no pacote)'
            echo '== timers'; systemctl list-timers --all --no-pager | grep -iE 'logan|rastre|NEXT' | cut -c1-150
            echo "== servicos: rastreio $(systemctl is-active rastreamento.service) | logan $(systemctl show ocoren-logan-tms.service -p ActiveState --value)/$(systemctl show ocoren-logan-tms.service -p Result --value) | recuperacao $(systemctl show ocoren-logan-recuperacao.service -p Result --value)"
            echo "== cron Total _08: alterado $(date -r /home/projetos/atualizar_total_08/cron.log '+%F %T' 2>/dev/null) | linhas com invalida/erro nas ultimas 300: $(tail -n 300 /home/projetos/atualizar_total_08/cron.log 2>/dev/null | grep -ciE 'invalid|erro|falha|traceback' || true)"
            for d in atualizar_total atualizar_total_08 atualizar_total_MQF; do f=/home/projetos/$d/cron.log; [ -f "$f" ] && tail -n 120 "$f" | grep -viE 'senha|password|token|bearer|authorization' > "$T/b/cron_$d.txt"; done
            crontab -l 2>/dev/null | grep -i total | sed -E 's#/home/projetos/#…/#g' > "$T/b/crontab_total.txt" || true
            tail -n 60 /home/projetos/atualizar_logan/ocoren_logan_tms/runtime/logs/recuperacao.log > "$T/b/recuperacao.txt" 2>&1 || true
            tail -n 60 /home/projetos/atualizar_logan/ocoren_logan_tms/runtime/logs/processor.log > "$T/b/processor.txt" 2>&1 || true
            journalctl -u rastreamento.service --since '2 hours ago' --no-pager 2>/dev/null | grep -iE 'error|traceback|exception|PRAZO' | tail -n 40 > "$T/b/rastreio_erros.txt" || true
            tar -czf "$T/pacote.tgz" -C "$T/b" .
            KEY=$(openssl rand -hex 32)
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$T/pacote.tgz" -out "$T/pacote.enc" -pass "pass:$KEY"
            printf '%s' "$KEY" | openssl pkeyutl -encrypt -pubin -inkey "$T/pub.pem" -out "$T/chave.enc"
            echo CHAVE_INICIO; base64 -w0 "$T/chave.enc"; echo; echo CHAVE_FIM
            echo DADOS_INICIO; base64 -w 900 "$T/pacote.enc"; echo DADOS_FIM
            rm -rf "$T"
