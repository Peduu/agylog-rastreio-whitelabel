# USO UNICO: a recuperacao por pedido da rotina Logan->TMS passa a guardar a previsao de entrega da Logan
# (consumidor.PrevisaoEntrega, mesma consulta, nenhuma a mais) em previsoes_logan.json para a pagina de rastreio.
# Sem "APLICAR" so confere (compila, importa, main.py como esperado). Backup antes; rodada de teste; restaura sozinho se falhar.
# Apagar este arquivo depois do uso.
name: "Uso unico - Previsao da Logan para o rastreio"

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Vazio = so confere. Digite APLICAR para gravar"
        required: false
        default: ""
        type: string

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Previsao da Logan (VPS)
        uses: appleboy/ssh-action@v1.0.3
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: CONFIRMAR
          command_timeout: 12m
          script: |
            set -uo pipefail
            D=/home/projetos/atualizar_logan
            P="$D/ocoren_logan_tms"
            ARQ="$D/previsoes_logan.json"
            LR="$P/runtime/logs/recuperacao.log"
            mask() { sed -E 's/[0-9]{5,}/99999/g; s/[A-Z0-9]{9,}/***/g'; }
            T=$(mktemp -d)
            mkdir -p "$T/pkg/ocoren_logan_tms"
            cp "$P"/*.py "$T/pkg/ocoren_logan_tms/"
            echo "" | base64 -d > "$T/previsoes_logan.py"
            echo "" | base64 -d > "$T/recuperacao_pedidos.py"
            cp "$T/previsoes_logan.py" "$T/recuperacao_pedidos.py" "$T/pkg/ocoren_logan_tms/"
            python3 -m py_compile "$T/previsoes_logan.py" "$T/recuperacao_pedidos.py" || { echo "ERRO: nao compila. Nada foi alterado."; rm -rf "$T"; exit 1; }
            ( cd "$T/pkg" && python3 -c "import importlib, ocoren_logan_tms.recuperacao_pedidos as r; m = importlib.import_module(r.process_dce_recovery.__module__); assert callable(m.fetch_logan_delivery_proof); print('   import ok; a recuperacao procura a consulta em', m.__name__)" ) || { echo "ERRO: import falhou. Nada foi alterado."; rm -rf "$T"; exit 1; }
            grep -q "fetch_logan_delivery_proof(settings, None, order)" "$P/main.py" && echo "   main.py chama a consulta da Logan como esperado" || { echo "ERRO: main.py diferente do esperado. Nada foi alterado."; rm -rf "$T"; exit 1; }
            echo "   timer: $(systemctl is-active ocoren-logan-recuperacao.timer) | servico do rastreio roda como: $(systemctl show rastreamento.service -p User --value)"
            if [ "${CONFIRMAR:-}" != "APLICAR" ]; then echo "SO RELATO: nada foi alterado. Rode com confirmar = APLICAR."; rm -rf "$T"; exit 0; fi

            B="$D/backups-claude-$(date +%Y%m%d-%H%M%S)-previsao"
            mkdir -p "$B" && cp -p "$P/recuperacao_pedidos.py" "$B/" || { echo "ERRO no backup; nada foi alterado"; rm -rf "$T"; exit 1; }
            echo "backup: $B"
            restaura() {
              echo "RESTAURANDO o backup"
              cp -p "$B/recuperacao_pedidos.py" "$P/recuperacao_pedidos.py"
              rm -f "$P/previsoes_logan.py"
            }
            DONO=$(stat -c '%u:%g' "$P/main.py")
            for f in previsoes_logan.py recuperacao_pedidos.py; do
              install -m 0644 "$T/$f" "$P/$f" && chown "$DONO" "$P/$f" || { restaura; rm -rf "$T"; exit 1; }
            done
            rm -rf "$T"
            INICIO=$(date '+%Y-%m-%d %H:%M:%S')
            echo "== rodada de teste ($INICIO)"
            systemctl start ocoren-logan-recuperacao.service
            R=$(systemctl show ocoren-logan-recuperacao.service -p Result --value)
            TB=$(journalctl -u ocoren-logan-recuperacao.service --since "$INICIO" --no-pager 2>/dev/null | grep -c "Traceback" || true)
            awk -v t="$INICIO" '$0 >= t' "$LR" > /tmp/rec_prev.log
            FIM=$(grep -c "Recuperacao por pedido concluida" /tmp/rec_prev.log || true)
            echo "resultado: $R | tracebacks: $TB | rodadas concluidas: $FIM"
            if [ "$R" != "success" ] || [ "$TB" -gt 0 ] || [ "$FIM" -lt 1 ]; then restaura; rm -f /tmp/rec_prev.log; exit 1; fi
            for padrao in "Iniciando recupera" "Recuperação enviada ao TMS" "Recuperação já enviada" "cooldown" "Previsoes da Logan guardadas" "Falha ao anotar" "Falha ao guardar"; do
              echo "   $(grep -c "$padrao" /tmp/rec_prev.log || true) x $padrao"
            done
            grep -E "Previsoes da Logan|Iniciando recupera" /tmp/rec_prev.log | tail -3 | mask | cut -c1-150 | sed 's/^/   /'
            rm -f /tmp/rec_prev.log
            U=$(systemctl show rastreamento.service -p User --value); [ -z "$U" ] && U=root
            if [ -f "$ARQ" ]; then
              ls -l "$ARQ" | awk '{print "   arquivo:", $1, $NF}'
              runuser -u "$U" -- test -r "$ARQ" && echo "   o servico do rastreio consegue ler o arquivo" || echo "   ATENCAO: o servico do rastreio NAO consegue ler o arquivo"
              python3 -c "import json,datetime; d=json.load(open('$ARQ')); p=d['pedidos']; h=datetime.date.today().isoformat(); print('   pedidos com previsao:', len(p), '| de hoje em diante:', sum(1 for v in p.values() if v['previsao']>=h), '| atualizado em', d['atualizado_em'])"
            else
              echo "   arquivo ainda nao existe (nenhuma previsao nesta rodada; a proxima rodada em 2 min tenta de novo)"
            fi
            {
              echo "21/10/2026 (Claude): previsao de entrega da Logan para a pagina de rastreio."
              echo "Novo: ocoren_logan_tms/previsoes_logan.py; alterado: recuperacao_pedidos.py (anota consumidor.PrevisaoEntrega da mesma consulta)."
              echo "Saida: $ARQ (lido pelo rastreio, prazo_transportadora.py)."
              echo "Desfazer: copiar recuperacao_pedidos.py deste backup de volta e apagar ocoren_logan_tms/previsoes_logan.py."
            } > "$B/LEIA-ME.txt"
            echo "APLICADO."
