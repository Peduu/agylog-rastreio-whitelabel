# USO UNICO (so leitura): Sonda da Total Express.
# Dados de pedidos vem do segredo temporario SONDA_AMOSTRA6 (o repositorio e publico; o log mostra so totais, formatos e textos
# que se repetem em 3+ pedidos, nunca pedido, nome ou endereco). Nao grava nada. Apagar este arquivo e o segredo depois do uso.
name: "Uso unico - Sonda da Total Express"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sonda so leitura na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          AMOSTRA: ${{ secrets.SONDA_AMOSTRA6 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: AMOSTRA
          command_timeout: 15m
          script: |
            set -euo pipefail
            AMOSTRA="$AMOSTRA" python3 - <<'PY'
            import base64, gzip, json, os, re, urllib.request
            from collections import Counter, defaultdict

            ENV = os.environ.get("SONDA_ENV", "/etc/rastreamento.env")
            URL = os.environ.get("SONDA_URL", "https://apis.totalexpress.com.br/ics-tracking-encomenda-lv/v1/tracking")
            env = {}
            for linha in open(ENV, encoding="utf-8", errors="replace"):
                linha = linha.strip()
                if linha and not linha.startswith("#") and "=" in linha:
                    k, v = linha.split("=", 1)
                    env[k.replace("export ", "").strip()] = v.strip().strip('"').strip("'")
            USER, SENHA = env.get("TOTAL_EXPRESS_API_USER", ""), env.get("TOTAL_EXPRESS_API_PASSWORD", "")
            print("credencial da Total presente:", bool(USER and SENHA))
            amostra = [l.split(";") for l in gzip.decompress(base64.b64decode(os.environ["AMOSTRA"])).decode().splitlines() if l.strip()]
            print("amostra:", Counter(a[2] for a in amostra))


            def total(chave):
                corpo = json.dumps({"pedidos": [chave], "comprovanteEntrega": False}).encode()
                auth = base64.b64encode(f"{USER}:{SENHA}".encode()).decode()
                req = urllib.request.Request(URL, data=corpo, headers={"Content-Type": "application/json", "Accept": "application/json",
                                                                       "Authorization": "Basic " + auth, "User-Agent": "AgyLog-Rastreamento/1.0"})
                try:
                    with urllib.request.urlopen(req, timeout=20) as r:
                        return r.status, json.loads(r.read().decode("utf-8"))
                except urllib.error.HTTPError as e:
                    return e.code, None
                except Exception as e:
                    return type(e).__name__, None


            def forma(v):
                return re.sub(r"[0-9]", "9", re.sub(r"[A-Za-z]", "A", str(v)))[:30]


            res = defaultdict(Counter)
            chaves_topo, chaves_enc, chaves_ev = Counter(), Counter(), Counter()
            prefixos = defaultdict(set)      # prefixo da descricao -> pedidos (so imprime os que se repetem em 3+ pedidos)
            ultimo = defaultdict(set)
            campos_valor = defaultdict(Counter)
            formatos_data = Counter()
            for pedido, nota, g in amostra:
                for nome, chave in (("pedido", pedido), ("nota", nota)):
                    if not chave:
                        continue
                    st, d = total(chave.upper())
                    achou = isinstance(d, dict) and isinstance(d.get("data"), list) and any(
                        str(e.get("pedido") or "").strip().upper() == chave.upper() for e in d["data"] if isinstance(e, dict))
                    res[g][f"por {nome}: HTTP {st} | {'ACHOU' if achou else 'nao'}"] += 1
                    if not achou:
                        continue
                    chaves_topo.update(d.keys())
                    for enc in d["data"]:
                        if not isinstance(enc, dict) or str(enc.get("pedido") or "").strip().upper() != chave.upper():
                            continue
                        chaves_enc.update(enc.keys())
                        for k, v in enc.items():
                            if k != "tracking" and not isinstance(v, (list, dict)) and len(str(v)) <= 25:
                                campos_valor[k][forma(v)] += 1
                        evs = enc.get("tracking") or []
                        res[g][f"por {nome}: eventos {min(len(evs), 6)}"] += 1
                        for ev in evs:
                            if isinstance(ev, dict):
                                chaves_ev.update(ev.keys())
                                for k, v in ev.items():
                                    if k != "descricao" and not isinstance(v, (list, dict)):
                                        # codigo/status do evento sao codigos da Total (nao dado pessoal): valor cru
                                        bruto = k.lower() in ("codigo", "status", "situacao", "tipo", "cod")
                                        campos_valor["ev." + k][str(v)[:12] if bruto else forma(v)] += 1
                                desc = re.sub(r"\s+", " ", str(ev.get("descricao") or "").upper()).strip()
                                prefixos[" ".join(re.sub(r"[0-9]", "9", desc).split()[:4])].add(chave)
                        if evs and isinstance(evs[-1], dict):
                            ult = " ".join(re.sub(r"[0-9]", "9", str(evs[-1].get("descricao") or "").upper()).split()[:4])
                            ultimo[ult].add(chave)
            print("campos topo:", dict(chaves_topo))
            print("campos da encomenda:", dict(chaves_enc))
            print("campos do evento:", dict(chaves_ev))
            for k, c in sorted(campos_valor.items()):
                print(f"  formato {k}:", c.most_common(25 if k.startswith("ev.cod") or k.startswith("ev.status") else 4))
            for g in sorted(res):
                print(g, dict(sorted(res[g].items())))
            print("descricoes dos eventos (inicio, so as que aparecem em 3+ pedidos):")
            for p, ps in sorted(prefixos.items(), key=lambda x: -len(x[1])):
                if len(ps) >= 3:
                    print(f"   {len(ps):3}  {p}")
            print("ultimo evento (inicio, 3+ pedidos):")
            for p, ps in sorted(ultimo.items(), key=lambda x: -len(x[1])):
                if len(ps) >= 3:
                    print(f"   {len(ps):3}  {p}")
            PY
