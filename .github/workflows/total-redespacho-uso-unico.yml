# USO UNICO: devolve para "erro" (como estavam) os eventos 38 recusados por De/Para que voltaram para a fila em 21/10 16:29
# mas ficaram fora da janela de 30 dias da rotina (16-20/09; nunca seriam reenviados e ficariam "pendente" para sempre).
# Com a trava da rotina. Log so com contagens. Apagar este arquivo depois do uso.
name: "Uso unico - Redespacho Correios da Total no TMS"

on:
  workflow_dispatch:

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fila (VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 12m
          script: |
            cd /home/projetos/atualizar_total_08 || exit 1
            python3 - <<'PY'
            import datetime as dt, fcntl, sqlite3, sys, time
            trava = open(".integracao_total_tms.lock", "w")
            inicio = time.time()
            while True:
                try:
                    fcntl.flock(trava.fileno(), fcntl.LOCK_EX | fcntl.LOCK_NB)
                    break
                except BlockingIOError:
                    if time.time() - inicio > 540:
                        sys.exit("rotina ocupada; nada foi alterado")
                    time.sleep(5)
            c = sqlite3.connect("/home/projetos/atualizar_total/operacoes_total_tms.db", timeout=30)
            filtro = "status_total = 38 AND status_envio = 'pendente' AND resposta_api LIKE '%De/Para%'"
            print("na fila antes:", c.execute("SELECT COUNT(*) FROM ocorrencias WHERE " + filtro).fetchone()[0],
                  "| mais nova:", c.execute("SELECT MAX(substr(data_ocorrencia_total, 1, 10)) FROM ocorrencias WHERE " + filtro).fetchone()[0])
            n = c.execute("UPDATE ocorrencias SET status_envio = 'erro', atualizado_em = ? WHERE " + filtro + " AND data_ocorrencia_total < ?",
                          (dt.datetime.now().isoformat(timespec="seconds"), "2026-10-21")).rowcount
            c.commit()
            print("voltaram para erro:", n, "| ainda na fila:", c.execute("SELECT COUNT(*) FROM ocorrencias WHERE " + filtro).fetchone()[0])
            print("pendentes no banco (todos):", c.execute("SELECT COUNT(*) FROM ocorrencias WHERE status_envio = 'pendente'").fetchone()[0])
            PY
