# USO UNICO (so leitura): o que o TMS registrou quando aceitou o codigo 78 (status 38 da Total, ate 16/09): codigo interno e
# descricao no TMS no horario do evento. Log so com codigos/descricoes/contagens (sem pedidos). Nao grava nada. Apagar depois.
name: "Uso unico - Sonda Total x TMS"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Sonda so leitura (VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            python3 - <<'PY'
            import json, sqlite3, urllib.request
            from collections import Counter
            env = {}
            for l in open("/etc/rastreamento.env", encoding="utf-8", errors="replace"):
                l = l.strip()
                if l and not l.startswith("#") and "=" in l:
                    k, v = l.split("=", 1)
                    env[k.replace("export ", "").strip()] = v.strip().strip('"').strip("'")
            url = env.get("TMS_API_URL") or "https://corellilog.tmselite.com/api/ocorrencias/ocorrencianotafiscaldepara"
            con = sqlite3.connect("file:/home/projetos/atualizar_total/operacoes_total_tms.db?mode=ro", uri=True)
            linhas = con.execute("""SELECT pedido, cnpj_cliente, data_ocorrencia_total, resposta_api FROM ocorrencias
                                    WHERE status_total = 38 AND codigo_ocorrencia_tms = '78' AND status_envio = 'enviado'
                                    ORDER BY registrado_em DESC LIMIT 8""").fetchall()
            achados = Counter()
            for pedido, cnpj, data, resp in linhas:
                alvo = data.replace("T", " ")[:16]
                corpo = {"cnpjEmbarcador": cnpj, "listaPedidos": [pedido]}
                req = urllib.request.Request(url, data=json.dumps(corpo).encode(), headers={
                    "Content-Type": "application/json", "Accept": "application/json", "Authorization": "Bearer " + env.get("TMS_API_TOKEN", "")})
                try:
                    d = json.loads(urllib.request.urlopen(req, timeout=40).read().decode("utf-8"))
                except Exception as exc:
                    achados["erro " + type(exc).__name__] += 1
                    continue
                evs = d.get("listaResultados") or []
                perto = [o for o in evs if str(o.get("dtOcorrencia") or "")[:16] == alvo]
                if not perto:
                    achados["sem evento no horario (" + str(len(evs)) + " eventos)"] += 1
                for o in perto:
                    achados["interno %s | %s" % (o.get("codigoOcorrencia"), str(o.get("descricaoOcorrencia") or "")[:50])] += 1
            print("pedidos com 78 aceito:", len(linhas))
            for k, n in achados.most_common():
                print("   %3d x %s" % (n, k))
            PY
