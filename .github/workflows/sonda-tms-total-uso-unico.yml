# USO UNICO (so leitura): por codigo de ocorrencia do TMS, quantos eventos da Total foram aceitos x recusados por "De/Para"
# (historico do banco de estado da rotina) + de/para de ocorrencias da rotina Logan. Log so com contagens. Apagar depois.
name: "Uso unico - Sonda Total x TMS"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Sonda so leitura (VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            python3 - <<'PY'
            import sqlite3
            con = sqlite3.connect("file:/home/projetos/atualizar_total/operacoes_total_tms.db?mode=ro", uri=True)
            print("codigo TMS | status Total | aceitos | recusa De/Para | outras recusas | ultimo aceito | ultima recusa De/Para")
            for row in con.execute("""
                SELECT codigo_ocorrencia_tms, status_total,
                       SUM(status_envio = 'enviado'),
                       SUM(status_envio = 'erro' AND resposta_api LIKE 'API do TMS rejeitou%De/Para%'),
                       SUM(status_envio = 'erro' AND resposta_api NOT LIKE 'API do TMS rejeitou%De/Para%'),
                       MAX(CASE WHEN status_envio = 'enviado' THEN substr(registrado_em, 1, 10) END),
                       MAX(CASE WHEN status_envio = 'erro' AND resposta_api LIKE 'API do TMS rejeitou%De/Para%' THEN substr(registrado_em, 1, 10) END)
                FROM ocorrencias GROUP BY 1, 2 ORDER BY 1, 2"""):
                print("   %-6s | %4s | %6s | %5s | %6s | %s | %s" % tuple("" if v is None else v for v in row))
            PY
            echo "== de/para de ocorrencias da rotina Logan (codigos TMS usados):"
            f=$(ls /home/projetos/atualizar_logan/lista_ocorrencias_simexpress.csv /home/projetos/atualizar_logan/*/lista_ocorrencias_simexpress.csv 2>/dev/null | head -1)
            [ -n "$f" ] && head -60 "$f" | cut -c1-160
