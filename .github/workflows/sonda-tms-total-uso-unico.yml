# USO UNICO (so leitura): quais status da Total o TMS recusou com "codigo da ocorrencia nao encontrado" (7 dias). Log so com
# status, codigos e datas (sem pedidos). Nao grava nada. Apagar depois do uso.
name: "Uso unico - Sonda Total x TMS"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Sonda so leitura (VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            python3 - <<'PY'
            import csv, re
            from collections import Counter
            from datetime import datetime, timedelta
            corte = (datetime.now() - timedelta(days=7)).isoformat(timespec="seconds")
            c = Counter()
            with open("/home/projetos/atualizar_total_08/log_envios_tms_08.csv", encoding="utf-8", errors="replace", newline="") as f:
                for row in csv.reader(f):
                    if len(row) < 17 or row[16] < corte or "digo da ocorr" not in row[15]:
                        continue
                    cliente = "ccxp" if re.sub(r"\D", "", row[13]).startswith("15871195") else "outros"
                    servico = re.findall(r"'servico': '(\d+)'", row[15])
                    c[(cliente, row[5], re.sub(r"[A-Z0-9]{9,}|\d{4,}", "*", row[6])[:40], row[12], ",".join(sorted(set(servico))), row[16][:13])] += 1
            for (cliente, st, desc, cod, serv, quando), n in sorted(c.items(), key=lambda kv: kv[0][5]):
                print(f"   {n:3} | {cliente:6} | status Total {st:>4} {desc:40} | codigo TMS {cod:>4} | servico {serv:5} | registrado {quando}")
            PY
