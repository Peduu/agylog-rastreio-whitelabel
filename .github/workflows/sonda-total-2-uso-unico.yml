# USO UNICO (so leitura): Sonda 2 da Total Express (erro 400).
# Dados de pedidos vem do segredo temporario NADA (o repositorio e publico; o log mostra so totais, formatos e textos
# que se repetem em 3+ pedidos, nunca pedido, nome ou endereco). Nao grava nada. Apagar este arquivo e o segredo depois do uso.
name: "Uso unico - Sonda 2 da Total Express (erro 400)"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sonda so leitura na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail
            python3 - <<'PY'
            import base64, json, os, re, sys, urllib.request

            sys.path.insert(0, "/home/rastreamento")
            ENV = "/etc/rastreamento.env"
            URL = "https://apis.totalexpress.com.br/ics-tracking-encomenda-lv/v1/tracking"
            env = {}
            for linha in open(ENV, encoding="utf-8", errors="replace"):
                linha = linha.strip()
                if linha and not linha.startswith("#") and "=" in linha:
                    k, v = linha.split("=", 1)
                    env[k.replace("export ", "").strip()] = v.strip().strip('"').strip("'")
            USER, SENHA = env.get("TOTAL_EXPRESS_API_USER", ""), env.get("TOTAL_EXPRESS_API_PASSWORD", "")
            print("usuario:", re.sub(r"[A-Za-z0-9]", "x", USER)[:40], "| tamanho da senha:", len(SENHA))


            def mascara(texto):
                return re.sub(r"[A-Z0-9]{6,}", lambda m: m.group(0)[:2] + "*" * (len(m.group(0)) - 2), texto)


            def chamar(rotulo, corpo, auth=True, ua=True):
                dados = json.dumps(corpo).encode()
                h = {"Content-Type": "application/json", "Accept": "application/json"}
                if ua:
                    h["User-Agent"] = "AgyLog-Rastreamento/1.0"
                if auth:
                    h["Authorization"] = "Basic " + base64.b64encode(f"{USER}:{SENHA}".encode()).decode()
                req = urllib.request.Request(URL, data=dados, headers=h)
                try:
                    with urllib.request.urlopen(req, timeout=20) as r:
                        corpo_r = r.read().decode("utf-8", "replace")
                        st = r.status
                except urllib.error.HTTPError as e:
                    corpo_r = e.read().decode("utf-8", "replace")
                    st = e.code
                except Exception as e:
                    print(f"{rotulo}: erro {type(e).__name__}")
                    return
                print(f"{rotulo}: HTTP {st} | {mascara(corpo_r[:400])}")


            # exemplos que funcionavam em 28/09 (CCXP, redespacho Total -> Correios)
            for cod in ("OMLTCO4BFTYE8QC", "OMLTCO7QHQHLTSC"):
                chamar("exemplo 28/09 como o portal", {"pedidos": [cod], "comprovanteEntrega": False})
            chamar("sem pedidos", {"pedidos": [], "comprovanteEntrega": False})
            chamar("sem autenticacao", {"pedidos": ["OMLTCO4BFTYE8QC"], "comprovanteEntrega": False}, auth=False)

            # a mesma funcao do portal (requests, igual producao)
            try:
                import requests
                r = requests.post(URL, json={"pedidos": ["OMLTCO4BFTYE8QC"], "comprovanteEntrega": False}, auth=(USER, SENHA),
                                  headers={"Accept": "application/json", "User-Agent": "AgyLog-Rastreamento/1.0"}, timeout=(2, 5))
                print("requests (igual ao portal): HTTP", r.status_code, "|", mascara(r.text[:400]))
            except Exception as e:
                print("requests: erro", type(e).__name__)
            PY
