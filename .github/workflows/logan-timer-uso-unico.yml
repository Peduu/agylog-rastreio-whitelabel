# USO UNICO: segunda opcao Logan->TMS com timer proprio (ocoren-logan-recuperacao, a cada 2 min): so a recuperacao por pedido,
# sem FTP, independente da leitura dos arquivos OCOREN. Sem "APLICAR" so relata. Se o servico novo der erro, desliga sozinho.
# Apagar este arquivo depois do uso.
name: "Uso unico - Timer da segunda opcao Logan"

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Vazio = so relata. Digite APLICAR para instalar o timer"
        required: false
        default: ""
        type: string

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Timer na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: CONFIRMAR
          command_timeout: 12m
          script: |
            set -uo pipefail
            D=/home/projetos/atualizar_logan
            P="$D/ocoren_logan_tms"
            U=/etc/systemd/system
            mask() { sed -E 's/[0-9]{5,}/99999/g; s/[A-Z0-9]{9,}/***/g'; }
            T=$(mktemp -d)
            echo "" | base64 -d > "$T/gerar_lista_recuperacao.py"
            echo "" | base64 -d > "$T/recuperacao_pedidos.py"
            python3 -m py_compile "$T/gerar_lista_recuperacao.py" "$T/recuperacao_pedidos.py" || { echo "ERRO: nao compila. Nada foi alterado."; exit 1; }
            grep -q "Claude 19/10/2026" "$P/main.py" || { echo "ERRO: main.py sem o conserto de hoje. Nada foi alterado."; exit 1; }
            echo "arquivos novos compilam; main.py ja tem o conserto; timer existente: $(systemctl list-unit-files ocoren-logan-recuperacao.timer --no-legend 2>/dev/null | wc -l)"
            if [ "${CONFIRMAR:-}" != "APLICAR" ]; then echo "SO RELATO: nada foi alterado. Rode com confirmar = APLICAR."; rm -rf "$T"; exit 0; fi
            B="$D/backups-claude-$(date +%Y%m%d-%H%M%S)-timer"
            mkdir -p "$B"
            cp -p "$P/gerar_lista_recuperacao.py" "$B/" 2>/dev/null || true
            echo "backup: $B"
            DONO=$(stat -c '%u:%g' "$P/main.py")
            for f in gerar_lista_recuperacao.py recuperacao_pedidos.py; do
              install -m 0644 "$T/$f" "$P/$f" && chown "$DONO" "$P/$f"
            done
            cat > "$U/ocoren-logan-recuperacao.service" <<'UNIT'
            [Unit]
            Description=Segunda opcao Logan TMS - recuperacao por pedido (Claude 19/10/2026)

            [Service]
            Type=oneshot
            WorkingDirectory=/home/projetos/atualizar_logan
            Environment=DCE_RECOVERY_BATCH_SIZE=30
            ExecStart=/usr/bin/python3 -m ocoren_logan_tms.recuperacao_pedidos
            UNIT
            cat > "$U/ocoren-logan-recuperacao.timer" <<'UNIT'
            [Unit]
            Description=Executa a recuperacao por pedido da Logan a cada 2 minutos

            [Timer]
            OnBootSec=90s
            OnUnitActiveSec=2min

            [Install]
            WantedBy=timers.target
            UNIT
            systemctl daemon-reload
            systemctl enable --now ocoren-logan-recuperacao.timer
            INICIO=$(date '+%Y-%m-%d %H:%M:%S')
            systemctl start ocoren-logan-recuperacao.service || true
            echo "== esperando 2 execucoes do timer novo (ate 7 min)"
            n=0
            for i in $(seq 1 42); do
              sleep 10
              n=$(journalctl -u ocoren-logan-recuperacao.service --since "$INICIO" --no-pager 2>/dev/null | grep -c "Deactivated successfully\|Failed with result\|Finished Segunda" || true)
              [ "$n" -ge 2 ] && break
            done
            J=$(journalctl -u ocoren-logan-recuperacao.service --since "$INICIO" --no-pager 2>/dev/null || true)
            TB=$(printf '%s\n' "$J" | grep -c "Traceback" || true)
            FAIL=$(printf '%s\n' "$J" | grep -c "Failed with result" || true)
            echo "execucoes: $n | tracebacks: $TB | falhas: $FAIL"
            if [ "$TB" -gt 0 ] || [ "$FAIL" -gt 0 ]; then
              echo "ERRO: desligando o timer novo"
              printf '%s\n' "$J" | grep -B1 -A3 "Error" | tail -12 | mask
              systemctl disable --now ocoren-logan-recuperacao.timer || true
              rm -f "$U/ocoren-logan-recuperacao.service" "$U/ocoren-logan-recuperacao.timer"; systemctl daemon-reload
              rm -rf "$T"; exit 1
            fi
            LR="$P/runtime/logs/recuperacao.log"
            echo "== recuperacao.log ($(wc -l < "$LR" 2>/dev/null || echo 0) linhas)"
            for padrao in "Lista da recuperacao por pedido atualizada" "Iniciando recuperação" "Recuperação enviada ao TMS" "Recuperação já enviada" "Nenhum rastreamento" "cooldown" "sem DeXPara" "Erro na recuperação"; do
              echo "   $(grep -c "$padrao" "$LR" 2>/dev/null || true) x $padrao"
            done
            grep -E "Lista da recuperacao|Iniciando recuperação" "$LR" | tail -3 | mask | cut -c1-170 | sed 's/^/   /'
            systemctl list-timers ocoren-logan-recuperacao.timer --no-pager | head -3 | sed 's/^/   /'
            rm -rf "$T"
            echo "APLICADO."
