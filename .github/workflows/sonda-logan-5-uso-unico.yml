# USO UNICO (so leitura): lista as pastas do FTP de ocorrencias da Logan (so contagens e datas; nao baixa nem apaga nada).
# Apagar este arquivo depois do uso.
name: "Uso unico - Sonda da Logan 5 (FTP de ocorrencias)"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sonda so leitura na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 12m
          script: |
            set -euo pipefail
            python3 - <<'PY'
            import ftplib
            from collections import Counter

            env = {}
            for linha in open("/home/projetos/atualizar_logan/.env", encoding="utf-8", errors="replace"):
                linha = linha.strip()
                if linha and not linha.startswith("#") and "=" in linha:
                    k, v = linha.split("=", 1)
                    env[k.strip()] = v.strip().strip('"').strip("'")
            ftp = ftplib.FTP(timeout=60)
            ftp.connect(env["FTP_HOST"], int(env.get("FTP_PORT", "21")))
            ftp.login(env["FTP_USER"], env["FTP_PASSWORD"])
            print("login no FTP da Logan: ok")
            for pasta in ("/", "/ocor", "/ocor/bkp"):
                try:
                    ftp.cwd(pasta)
                    nomes = ftp.nlst()
                except Exception as e:
                    print(f"== {pasta}: erro {type(e).__name__}")
                    continue
                arquivos = [n for n in nomes if "." in n]
                pastas = [n for n in nomes if "." not in n]
                print(f"== {pasta}: {len(arquivos)} arquivos | subpastas: {pastas[:10]}")
                datas = Counter()
                recentes = sorted(arquivos)[-400:] if len(arquivos) > 400 else arquivos
                for n in recentes:
                    try:
                        r = ftp.sendcmd(f"MDTM {n}")
                        datas[r.split()[-1][:8]] += 1
                    except Exception:
                        datas["?"] += 1
                print(f"   data (MDTM) dos ultimos {len(recentes)} arquivos por nome:", sorted(datas.items())[-15:])
            ftp.quit()
            PY
