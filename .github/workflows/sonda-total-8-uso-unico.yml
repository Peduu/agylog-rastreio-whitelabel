# USO UNICO (so leitura): TMS x Total para 4 pedidos do CCXP que o Pedro mandou (codigos no segredo temporario
# SONDA_CODIGOS; o log numera os pedidos e mascara numeros). Nao grava nada. Apagar este arquivo e o segredo depois do uso.
name: "Uso unico - Sonda 8 da Total Express (4 pedidos do CCXP)"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sonda so leitura na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          CODIGOS: ${{ secrets.SONDA_CODIGOS }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: CODIGOS
          script: |
            set -euo pipefail
            CODIGOS="$CODIGOS" python3 - <<'PY'
            import base64, json, os, re, sqlite3, urllib.request
            from datetime import datetime
            from pathlib import Path

            env = {}
            for linha in open("/etc/rastreamento.env", encoding="utf-8", errors="replace"):
                linha = linha.strip()
                if linha and not linha.startswith("#") and "=" in linha:
                    k, v = linha.split("=", 1)
                    env[k.strip()] = v.strip().strip('"').strip("'")
            TMS_URL = env.get("TMS_API_URL") or "https://corellilog.tmselite.com/api/ocorrencias/ocorrencianotafiscaldepara"
            AUTH = base64.b64encode(f"{env.get('TOTAL_EXPRESS_API_USER', '')}:{env.get('TOTAL_EXPRESS_API_PASSWORD', '')}".encode()).decode()
            codigos = [c for c in os.environ["CODIGOS"].split(",") if c]


            def post(url, corpo, headers):
                req = urllib.request.Request(url, data=json.dumps(corpo).encode(), headers=dict({"Content-Type": "application/json",
                                                                                              "Accept": "application/json"}, **headers))
                try:
                    with urllib.request.urlopen(req, timeout=30) as r:
                        return r.status, json.loads(r.read().decode("utf-8"))
                except urllib.error.HTTPError as e:
                    return e.code, None
                except Exception as e:
                    return type(e).__name__, None


            p = sqlite3.connect(Path("/home/rastreamento/database.db").resolve().as_uri() + "?mode=ro", uri=True)
            for i, cod in enumerate(codigos, 1):
                print(f"===== pedido {i}")
                row = p.execute("SELECT cnpj_cliente FROM rastreios WHERE codigo = ?", (cod,)).fetchone()
                cnpj = row[0] if row else ""
                tms = None
                for chave in ("listaNotasFiscais", "listaPedidos"):
                    st, d = post(TMS_URL, {"cnpjEmbarcador": cnpj, chave: [cod]}, {"Authorization": f"Bearer {env.get('TMS_API_TOKEN', '')}"})
                    if d and not d.get("flagErro") and d.get("listaResultados"):
                        tms = d["listaResultados"]
                        break
                print("TMS:", "nada" if not tms else f"{len(tms)} ocorrencias")
                for o in sorted(tms or [], key=lambda o: str(o.get("dtOcorrencia"))):
                    print("   ", str(o.get("dtOcorrencia"))[:16], "| cod", o.get("codigoOcorrencia"), "|", str(o.get("descricaoOcorrencia"))[:45],
                          "| unidade", o.get("unidadeOcorrencia"), "|", o.get("nomeCidade"), o.get("uf"))
                st, t = post("https://apis.totalexpress.com.br/ics-tracking-encomenda-lv/v1/tracking", {"pedidos": [cod], "comprovanteEntrega": False},
                             {"Authorization": "Basic " + AUTH, "User-Agent": "AgyLog-Rastreamento/1.0"})
                evs = [ev for e in ((t or {}).get("data") or []) if isinstance(e, dict) for ev in (e.get("tracking") or [])]
                print("Total:", f"HTTP {st}", "| eventos", len(evs))
                for ev in evs[-4:]:
                    print("   ", str(ev.get("data"))[:16], "| status", ev.get("status"), "|", " ".join(str(ev.get("descricao")).split()[:6]))
            # a rotina da Logan: ultimas linhas do log (mascaradas)
            for pasta in ("/home/projetos/atualizar_logan",):
                for nome in sorted(os.listdir(pasta)) if os.path.isdir(pasta) else []:
                    if nome.endswith(".log"):
                        linhas = open(os.path.join(pasta, nome), encoding="utf-8", errors="replace").read().splitlines()
                        print(f"== {pasta}/{nome}: {len(linhas)} linhas; ultimas:")
                        for l in linhas[-6:]:
                            print("   ", re.sub(r"\b[A-Z0-9]{10,}\b", "***", re.sub(r"\d{5,}", "99999", l))[:160])
            PY
