# USO UNICO (so leitura): onde o servico que envia pedidos para a Logan guarda o que enviou (runtime, bancos, pastas SFTP; so
# nomes, contagens e datas). Nao grava nada. Apagar este arquivo depois do uso.
name: "Uso unico - Sonda da Logan 7 (o que foi enviado a Logan)"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sonda so leitura na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            python3 - <<'PY'
            import glob, os, re, sqlite3
            from collections import Counter
            from datetime import datetime

            P = "/home/projetos/totalexpress-shipment-api"
            print("== .env.logan (so nomes)")
            for linha in open(os.path.join(P, ".env.logan"), encoding="utf-8", errors="replace"):
                if "=" in linha and not linha.strip().startswith("#"):
                    print("  ", linha.split("=", 1)[0].strip())
            print("== runtime")
            for raiz, pastas, arqs in os.walk(os.path.join(P, "runtime")):
                if raiz.count(os.sep) - P.count(os.sep) > 2:
                    continue
                print(f"  {raiz}: {len(arqs)} arquivos, subpastas {pastas[:8]}")
                for a in sorted(arqs, key=lambda x: -os.path.getmtime(os.path.join(raiz, x)))[:8]:
                    f = os.path.join(raiz, a)
                    print(f"     {re.sub(r'[0-9]{5,}', '9999', a)[:60]} | {os.path.getsize(f)} bytes | {datetime.fromtimestamp(os.path.getmtime(f)):%Y-%m-%d %H:%M}")
            for db in glob.glob(os.path.join(P, "runtime", "**", "*.db"), recursive=True) + glob.glob(os.path.join(P, "*.db")):
                print("== banco", db)
                try:
                    c = sqlite3.connect(f"file:{db}?mode=ro", uri=True)
                    for (t,) in c.execute("SELECT name FROM sqlite_master WHERE type='table'"):
                        cols = [r[1] for r in c.execute(f'PRAGMA table_info("{t}")')]
                        n = c.execute(f'SELECT COUNT(*) FROM "{t}"').fetchone()[0]
                        print(f"   {t}: {n} linhas | colunas {cols[:18]}")
                        for col in cols:
                            if re.search(r"parceiro|partner|transportadora|carrier|status|criado|created|data", col, re.I):
                                try:
                                    vals = c.execute(f'SELECT "{col}", COUNT(*) FROM "{t}" GROUP BY 1 ORDER BY 2 DESC LIMIT 6').fetchall()
                                    print(f"      {col}: {[(str(v)[:19], k) for v, k in vals]}")
                                except sqlite3.Error:
                                    pass
                except sqlite3.Error as e:
                    print("   erro", type(e).__name__)
            print("== pastas do SFTP de NOTFIS (contagem por mes)")
            for d in sorted(glob.glob("/home/xml_sftp/ENVIOS_PROCEDA*") + glob.glob("/home/cliente_sftp/*/ENVIOS*") + glob.glob("/home/cliente_sftp/AGYLOG/*")):
                if os.path.isdir(d):
                    arqs = [os.path.join(d, a) for a in os.listdir(d)]
                    meses = Counter(datetime.fromtimestamp(os.path.getmtime(a)).strftime("%Y-%m") for a in arqs)
                    print(f"   {d}: {len(arqs)} | {sorted(meses.items())[-3:]}")
            PY
