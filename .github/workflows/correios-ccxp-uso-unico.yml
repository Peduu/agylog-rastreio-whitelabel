# USO UNICO: grava o codigo dos Correios (coluna rastreios.codigo_correios) de pedidos
# CCXP que seguem via Total. Sem "GRAVAR" so relata. Apagar este arquivo depois do uso.
name: "Uso unico - Codigo Correios CCXP"

on:
  workflow_dispatch:
    inputs:
      itens:
        description: "PEDIDO=CODIGO separados por virgula (ex.: OMLTCO4BFTYE8QC=AD943406192BR)"
        required: true
        type: string
      confirmar:
        description: "Vazio = so relata. Digite GRAVAR para gravar (com backup do banco antes)"
        required: false
        default: ""
        type: string

concurrency:
  group: rastreamento-production-deploy
  cancel-in-progress: false

jobs:
  correios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validar entrada
        env:
          ITENS: ${{ inputs.itens }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          itens = [i.strip().upper() for i in re.split(r"[,;\s]+", os.environ["ITENS"]) if i.strip()]
          if not itens:
              sys.exit("Nenhum item informado.")
          for item in itens:
              if not re.fullmatch(r"[A-Z0-9]{5,30}=[A-Z]{2}[0-9]{9}[A-Z]{2}", item):
                  sys.exit(f"Item invalido: {item} (formato PEDIDO=AA123456789BR)")
          print(f"{len(itens)} item(ns) valido(s).")
          PY

      - name: Relatar / gravar na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          ITENS: ${{ inputs.itens }}
          CONFIRMAR: ${{ inputs.confirmar }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: ITENS,CONFIRMAR
          script: |
            set -euo pipefail
            ITENS="$ITENS" CONFIRMAR="$CONFIRMAR" python3 - <<'PY'
            import os, re, sqlite3, sys
            from datetime import datetime

            DB = "/home/rastreamento/database.db"
            itens = [i.strip().upper() for i in re.split(r"[,;\s]+", os.environ["ITENS"]) if i.strip()]
            pares = [i.split("=", 1) for i in itens]
            gravar = os.environ.get("CONFIRMAR", "").strip() == "GRAVAR"

            if not os.path.exists(DB):
                sys.exit(f"ERRO: {DB} nao existe. Nada foi alterado.")

            conn = sqlite3.connect(DB)
            conn.row_factory = sqlite3.Row
            colunas = [r["name"] for r in conn.execute("PRAGMA table_info(rastreios)")]
            tem_coluna = "codigo_correios" in colunas
            print(f"Colunas de rastreios: {colunas}")
            print(f"Coluna codigo_correios existe: {tem_coluna}")

            faltando = []
            for pedido, correios in pares:
                row = conn.execute("SELECT * FROM rastreios WHERE codigo = ? LIMIT 1", (pedido,)).fetchone()
                if not row:
                    faltando.append(pedido)
                    print(f"[AUSENTE] {pedido}: nao esta na tabela rastreios")
                    continue
                atual = row["codigo_correios"] if tem_coluna else None
                print(f"[OK] {pedido}: cnpj={row['cnpj_cliente'] if 'cnpj_cliente' in colunas else '-'} "
                      f"codigo_correios atual={atual!r} -> novo={correios}")

            if not gravar:
                print("MODO RELATORIO: nada foi alterado.")
                sys.exit(0)
            if faltando:
                sys.exit(f"ERRO: pedidos ausentes no banco {faltando}. Nada foi alterado.")

            ts = datetime.now().strftime("%Y%m%d-%H%M%S")
            pasta = f"/home/rastreamento/backups/correios-ccxp-{ts}"
            os.makedirs(pasta, exist_ok=True)
            destino = sqlite3.connect(f"{pasta}/database.db")
            conn.backup(destino)
            destino.close()
            print(f"Backup do banco: {pasta}/database.db")

            with conn:
                if not tem_coluna:
                    conn.execute("ALTER TABLE rastreios ADD COLUMN codigo_correios TEXT")
                    print("Coluna codigo_correios criada.")
                for pedido, correios in pares:
                    n = conn.execute("UPDATE rastreios SET codigo_correios = ? WHERE codigo = ?",
                                     (correios, pedido)).rowcount
                    print(f"[GRAVADO] {pedido} = {correios} ({n} linha)")
            conn.close()
            PY

      - name: Conferir no portal publico (CCXP)
        if: ${{ inputs.confirmar == 'GRAVAR' }}
        env:
          ITENS: ${{ inputs.itens }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request
          erro = False
          for item in [i.strip().upper() for i in re.split(r"[,;\s]+", os.environ["ITENS"]) if i.strip()]:
              pedido, correios = item.split("=", 1)
              req = urllib.request.Request(
                  "https://rastreamento.agylog.com.br/api/rastrear",
                  data=json.dumps({"codigo": pedido, "cliente": "ccxp"}).encode(),
                  headers={"Content-Type": "application/json"})
              dados = json.load(urllib.request.urlopen(req, timeout=30))
              visto = (dados.get("rastreioTerceiro") or {}).get("codigoTerceiro")
              print(f"{pedido}: portal mostra Correios={visto!r}")
              erro |= visto != correios
          sys.exit(1 if erro else 0)
          PY
