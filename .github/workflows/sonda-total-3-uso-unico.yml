# USO UNICO (so leitura): Sonda 3 da Total Express (eventos dos pedidos repassados). Pedidos vem do segredo temporario SONDA_AMOSTRA8 (repositorio publico: log so com totais,
# formatos e textos que se repetem em 3+ pedidos). Nao grava nada. Apagar este arquivo e o segredo depois do uso.
name: "Uso unico - Sonda 3 da Total Express (eventos dos pedidos repassados)"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sonda so leitura na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          AMOSTRA: ${{ secrets.SONDA_AMOSTRA8 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: AMOSTRA
          command_timeout: 10m
          script: |
            set -euo pipefail
            AMOSTRA="$AMOSTRA" python3 - <<'PY'
            import base64, gzip, json, os, re, urllib.request
            from collections import Counter, defaultdict

            ENV = os.environ.get("SONDA_ENV", "/etc/rastreamento.env")
            URL = os.environ.get("SONDA_URL", "https://apis.totalexpress.com.br/ics-tracking-encomenda-lv/v1/tracking")
            env = {}
            for linha in open(ENV, encoding="utf-8", errors="replace"):
                linha = linha.strip()
                if linha and not linha.startswith("#") and "=" in linha:
                    k, v = linha.split("=", 1)
                    env[k.replace("export ", "").strip()] = v.strip().strip('"').strip("'")
            USER, SENHA = env.get("TOTAL_EXPRESS_API_USER", ""), env.get("TOTAL_EXPRESS_API_PASSWORD", "")
            amostra = [l.split(";") for l in gzip.decompress(base64.b64decode(os.environ["AMOSTRA"])).decode().splitlines() if l.strip()]
            print("amostra:", Counter(a[2] for a in amostra))


            def total(chave):
                corpo = json.dumps({"pedidos": [chave], "comprovanteEntrega": False}).encode()
                auth = base64.b64encode(f"{USER}:{SENHA}".encode()).decode()
                req = urllib.request.Request(URL, data=corpo, headers={"Content-Type": "application/json", "Accept": "application/json",
                                                                       "Authorization": "Basic " + auth, "User-Agent": "AgyLog-Rastreamento/1.0"})
                try:
                    with urllib.request.urlopen(req, timeout=20) as r:
                        return r.status, json.loads(r.read().decode("utf-8"))
                except urllib.error.HTTPError as e:
                    try:
                        return e.code, json.loads(e.read().decode("utf-8"))
                    except Exception:
                        return e.code, None
                except Exception as e:
                    return type(e).__name__, None


            def forma(v):
                return re.sub(r"[0-9]", "9", re.sub(r"[A-Za-z]", "A", str(v)))[:30]


            res = defaultdict(Counter)
            chaves_enc, chaves_ev = Counter(), Counter()
            prefixos, ultimo = defaultdict(set), defaultdict(set)
            valores = defaultdict(Counter)
            erros = Counter()
            for pedido, nota, g in amostra:
                for nome, chave in (("pedido", pedido), ("nota", nota)):
                    if not chave:
                        continue
                    st, d = total(chave.upper())
                    if st != 200:
                        erros[(st, str((d or {}).get("descricao", ""))[:40])] += 1
                    encs = [e for e in (d or {}).get("data") or [] if isinstance(e, dict) and str(e.get("pedido") or "").strip().upper() == chave.upper()]
                    res[g][f"por {nome}: HTTP {st} | {'ACHOU' if encs else 'nao'}"] += 1
                    for enc in encs:
                        chaves_enc.update(enc.keys())
                        for k, v in enc.items():
                            if k != "tracking" and not isinstance(v, (list, dict)):
                                valores["enc." + k][forma(v)] += 1
                        evs = [ev for ev in enc.get("tracking") or [] if isinstance(ev, dict)]
                        res[g][f"por {nome}: eventos {min(len(evs), 8)}"] += 1
                        for ev in evs:
                            chaves_ev.update(ev.keys())
                            for k, v in ev.items():
                                if k != "descricao" and not isinstance(v, (list, dict)):
                                    valores["ev." + k][str(v)[:14] if k.lower() in ("codigo", "status", "situacao", "cod") else forma(v)] += 1
                            desc = " ".join(re.sub(r"[0-9]", "9", str(ev.get("descricao") or "").upper()).split()[:5])
                            prefixos[desc].add(chave)
                        if evs:
                            ultimo[" ".join(re.sub(r"[0-9]", "9", str(evs[-1].get("descricao") or "").upper()).split()[:5])].add(chave)
            print("erros:", dict(erros))
            print("campos da encomenda:", dict(chaves_enc))
            print("campos do evento:", dict(chaves_ev))
            for k, c in sorted(valores.items()):
                print(f"  {k}:", c.most_common(30 if k.startswith("ev.cod") else 4))
            for g in sorted(res):
                print(g, dict(sorted(res[g].items())))
            print("descricoes (inicio; so as que aparecem em 3+ pedidos):")
            for p, ps in sorted(prefixos.items(), key=lambda x: -len(x[1])):
                if len(ps) >= 3:
                    print(f"   {len(ps):3}  {p}")
            print("ultimo evento (3+ pedidos):")
            for p, ps in sorted(ultimo.items(), key=lambda x: -len(x[1])):
                if len(ps) >= 3:
                    print(f"   {len(ps):3}  {p}")
            PY
