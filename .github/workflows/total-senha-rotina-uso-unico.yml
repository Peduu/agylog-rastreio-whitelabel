# USO UNICO: troca a senha da Total Express na rotina Total->TMS /home/projetos/atualizar_total_08 (regras.json, total.senha)
# copiando o segredo TOTAL_EXPRESS_API_PASSWORD (gravado pelo Pedro). So troca se o usuario da rotina for o do segredo.
# Sem "TROCAR" so relata. Backup do regras.json antes. Depois espera a proxima rodada do cron e mostra o resultado.
# Apagar este arquivo depois do uso.
name: "Uso unico - Senha nova da Total na rotina Total para TMS"

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Vazio = so relata. Digite TROCAR para gravar (com backup do regras.json antes)"
        required: false
        default: ""
        type: string

jobs:
  trocar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trocar a senha da Total na rotina (VPS)
        uses: appleboy/ssh-action@v1.0.3
        env:
          TOTAL_USER: ${{ secrets.TOTAL_EXPRESS_API_USER }}
          TOTAL_SENHA: ${{ secrets.TOTAL_EXPRESS_API_PASSWORD }}
          CONFIRMAR: ${{ inputs.confirmar }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: TOTAL_USER,TOTAL_SENHA,CONFIRMAR
          command_timeout: 15m
          script: |
            set -euo pipefail
            python3 - <<'PY'
            import json, os, re, shutil, sys, tempfile, time
            from datetime import datetime
            from pathlib import Path

            PASTA = Path(os.environ.get("ROTINA", "/home/projetos/atualizar_total_08"))
            REGRAS = PASTA / "regras.json"
            LOG = PASTA / "cron.log"
            gravar = os.environ.get("CONFIRMAR", "").strip() == "TROCAR"
            usuario, senha = os.environ.get("TOTAL_USER", ""), os.environ.get("TOTAL_SENHA", "")


            def mascara(t):
                t = re.sub(r"\d{5,}", lambda m: "9" * len(m.group(0)), t)
                return re.sub(r"\b[A-Z0-9]{10,}\b", lambda m: m.group(0)[:3] + "***", t)


            if not usuario or not senha:
                sys.exit("ERRO: segredos da Total vazios. Nada foi alterado.")
            if not re.fullmatch(r"[A-Za-z0-9._@+#-]+", senha):
                sys.exit("ERRO: senha com formato inesperado. Nada foi alterado.")
            if not REGRAS.exists():
                sys.exit(f"ERRO: {REGRAS} nao existe. Nada foi alterado.")
            bruto = REGRAS.read_text(encoding="utf-8")
            cfg = json.loads(bruto)
            total = cfg.get("total") if isinstance(cfg, dict) else None
            if not isinstance(total, dict) or "senha" not in total or "usuario" not in total:
                sys.exit("ERRO: regras.json sem total.usuario/total.senha. Nada foi alterado.")
            print("rotina:", PASTA)
            print("usuario do arquivo = usuario do segredo:", total["usuario"] == usuario)
            print("senha do arquivo = senha nova:", total["senha"] == senha)
            if total["usuario"] != usuario:
                sys.exit("ERRO: o usuario da rotina nao e o do segredo; nao troco a senha de outra conta. Nada foi alterado.")
            if total["senha"] == senha:
                print("A senha ja e a nova. Nada a fazer.")
                gravar = False
            elif not gravar:
                print("SO RELATO: nada gravado. Para trocar, rode de novo com confirmar = TROCAR.")

            if gravar:
                m = re.search(r"\n([ \t]+)\"", bruto)
                recuo = len(m.group(1)) if m else 2
                total["senha"] = senha
                novo = json.dumps(cfg, ensure_ascii=False, indent=recuo) + ("\n" if bruto.endswith("\n") else "")
                assert json.loads(novo)["total"]["senha"] == senha and json.loads(novo)["total"]["usuario"] == usuario
                backup = REGRAS.with_name(f"regras.json.bak-{datetime.now():%Y%m%d-%H%M%S}-senha-total-nova")
                shutil.copy2(REGRAS, backup)
                print("backup:", backup)
                st = REGRAS.stat()
                with tempfile.NamedTemporaryFile("w", encoding="utf-8", dir=PASTA, prefix=".regras-", delete=False) as tmp:
                    tmp.write(novo)
                os.chown(tmp.name, st.st_uid, st.st_gid)
                os.chmod(tmp.name, st.st_mode & 0o7777)
                os.replace(tmp.name, REGRAS)
                print("senha da Total trocada no regras.json (valor nao exibido)")

                # espera a proxima rodada do cron (a cada 10 min) e mostra o resultado, com numeros mascarados
                tamanho = LOG.stat().st_size if LOG.exists() else 0
                fim = time.time() + 12 * 60
                while time.time() < fim:
                    time.sleep(30)
                    if LOG.exists() and LOG.stat().st_size > tamanho:
                        with LOG.open(encoding="utf-8", errors="replace") as f:
                            f.seek(tamanho)
                            novo_log = f.read()
                        if "Processamento finalizado" in novo_log:
                            linhas = novo_log.splitlines()
                            print("== rodada do cron depois da troca:")
                            print("   'Autenticacao invalida':", sum("Autentica" in l and "inv" in l for l in linhas))
                            for l in linhas[-12:]:
                                print("   " + mascara(l)[:170])
                            break
                else:
                    print("AVISO: a rotina nao terminou uma rodada em 12 minutos; conferir o cron.log depois.")
            PY
