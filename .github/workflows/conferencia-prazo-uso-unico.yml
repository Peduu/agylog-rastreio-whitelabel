# USO UNICO (so leitura): confere na API publica do rastreio (local, 127.0.0.1) se os pedidos com previsao da Logan
# mostram essa data. Log so com contagens (sem pedidos). Nao grava nada. Apagar depois do uso.
name: "Uso unico - Conferencia do prazo da transportadora"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Conferencia so leitura (VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -uo pipefail
            python3 - <<'PY'
            import json, time, urllib.request
            from collections import Counter
            from datetime import date, datetime
            d = json.load(open("/home/projetos/atualizar_logan/previsoes_logan.json", encoding="utf-8"))
            pedidos = d["pedidos"]
            hoje = date.today().isoformat()
            futuras = {k: v["previsao"] for k, v in pedidos.items() if v["previsao"] >= hoje}
            print("arquivo da Logan:", len(pedidos), "pedidos |", len(futuras), "com previsao de hoje em diante | atualizado", d["atualizado_em"])
            print("previsoes por dia:", sorted(Counter(v["previsao"] for v in pedidos.values()).items())[-8:])
            resultado = Counter()
            for cod, prev in list(futuras.items())[:10]:
                esperado = datetime.strptime(prev, "%Y-%m-%d").strftime("%d/%m/%Y")
                req = urllib.request.Request("http://127.0.0.1:8000/api/rastrear", data=json.dumps({"codigo": cod}).encode(),
                                             headers={"Content-Type": "application/json"})
                try:
                    r = json.loads(urllib.request.urlopen(req, timeout=60).read().decode("utf-8"))
                except Exception as exc:
                    resultado["erro " + type(exc).__name__] += 1
                    continue
                st = r.get("status")
                if r.get("previsao") == esperado:
                    resultado[f"{st}: pagina mostra a previsao da Logan"] += 1
                elif r.get("previsao"):
                    resultado[f"{st}: pagina mostra OUTRA data"] += 1
                else:
                    resultado[f"{st}: sem previsao na pagina"] += 1
                time.sleep(2.5)
            print("conferencia na API do rastreio:", dict(resultado))
            PY
            echo "== recuperacao desde 15:04: rodadas $(journalctl -u ocoren-logan-recuperacao.service --since '2026-10-21 15:04' --no-pager | grep -c 'Deactivated successfully\|Finished' || true) | falhas $(journalctl -u ocoren-logan-recuperacao.service --since '2026-10-21 15:04' --no-pager | grep -c 'Failed with result\|Traceback' || true) | timer $(systemctl is-active ocoren-logan-recuperacao.timer) | 'Previsoes guardadas' no log: $(grep -c 'Previsoes da Logan guardadas' /home/projetos/atualizar_logan/ocoren_logan_tms/runtime/logs/recuperacao.log || true) | 'Falha ao' no log: $(grep -c 'Falha ao anotar\|Falha ao guardar' /home/projetos/atualizar_logan/ocoren_logan_tms/runtime/logs/recuperacao.log || true)"
            echo "== servico: $(systemctl is-active rastreamento.service) | erros de prazo no journal (30 min): $(journalctl -u rastreamento.service --since '30 min ago' --no-pager 2>/dev/null | grep -c 'PRAZO' || true)"
