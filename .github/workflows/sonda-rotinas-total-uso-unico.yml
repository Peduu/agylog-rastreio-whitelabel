# USO UNICO (so leitura): por que a rotina Total MQF parou e quais clientes cada rotina cobre.
# Repo PUBLICO: o log so tem contagens, slugs de cliente do portal e mensagens com nomes/numeros mascarados.
# Nao grava nada. Apagar depois do uso.
name: "Uso unico - Saude rotinas Total"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Sonda so leitura (VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "agora: $(date '+%Y-%m-%d %H:%M')"
            crontab -l 2>/dev/null | grep -v '^#' | grep 'atualizar_total' | sed -E 's#(/home/projetos/[A-Za-z0-9_]+).*#\1#' | awk '{print "cron:", $1, $2, $3, $4, $5, $NF}'
            cat > /tmp/sonda_total_$$.py <<'PY'
            import csv, json, os, re, sqlite3
            from collections import Counter, defaultdict
            from datetime import datetime, timedelta

            def limpa(t):
                t = str(t)
                t = re.sub(r"https?://\S+", "<url>", t)
                t = re.sub(r"\b[A-ZÀ-Ú][A-Za-zÀ-ú'.]+(?:\s+(?:d[aeo]s?\s+)?[A-ZÀ-Ú][A-Za-zÀ-ú'.]+)+", "<nome>", t)
                t = re.sub(r"[A-Z]{2,}[A-Z0-9]{6,}", "***", t)
                t = re.sub(r"\d+", "9", t)
                return re.sub(r"\s+", " ", t).strip()[:95]

            # CNPJ (raiz 8 digitos) -> slug do portal, pela base do rastreio
            slug = {}
            try:
                p = sqlite3.connect("file:/home/rastreamento/database.db?mode=ro", uri=True)
                cols = [r[1] for r in p.execute("PRAGMA table_info(rastreios)")]
                ccol = next((c for c in ("cliente", "cliente_slug", "slug") if c in cols), None)
                if ccol and "cnpj_cliente" in cols:
                    for cli, cnpj in p.execute("SELECT %s, cnpj_cliente FROM rastreios WHERE cnpj_cliente <> '' GROUP BY 1, 2" % ccol):
                        slug.setdefault(re.sub(r"\D", "", cnpj or "")[:8], str(cli or "?").lower())
                print("colunas rastreios com cliente:", ccol, "| raizes de CNPJ mapeadas:", len(slug))
            except Exception as exc:
                print("mapa de clientes indisponivel:", type(exc).__name__)

            def cli(cnpj):
                raiz = re.sub(r"\D", "", cnpj or "")[:8]
                return slug.get(raiz, "sem cnpj" if not raiz else "nao mapeado")

            def esqueleto(o, nivel=0):
                if isinstance(o, dict):
                    return {k: ("<oculto>" if re.search(r"(?i)senha|password|token|secret|key|usuario|user|login|email|cpf|nome", k) else esqueleto(v, nivel + 1)) for k, v in o.items()}
                if isinstance(o, list):
                    nums = [re.sub(r"\D", "", str(x)) for x in o]
                    if nums and all(len(n) >= 11 for n in nums):
                        return {"cnpjs": len(o), "clientes": sorted(set(cli(n) for n in nums))}
                    return "lista(%d)" % len(o)
                if isinstance(o, (int, float, bool)) or o is None:
                    return o
                return "texto" if len(str(o)) > 20 or re.search(r"\d{5,}", str(o)) else str(o)

            corte = (datetime.now() - timedelta(days=10)).strftime("%Y-%m-%d")
            for d in ("atualizar_total_08", "atualizar_total_MQF"):
                base = "/home/projetos/" + d
                print("\n==", d)
                try:
                    print("regras.json:", json.dumps(esqueleto(json.load(open(base + "/regras.json", encoding="utf-8"))), ensure_ascii=False)[:1500])
                except Exception as exc:
                    print("regras.json indisponivel:", type(exc).__name__)
                linhas = open(base + "/cron.log", encoding="utf-8", errors="replace").read().splitlines()[-3000:]
                formas = Counter(limpa(l) for l in linhas if re.search(r"(?i)\berro|error|falh|traceback|exception", l))
                for f, n in formas.most_common(8):
                    print("   erro no log %4d | %s" % (n, f))
                ultimas = [limpa(l) for l in linhas if l.strip()][-4:]
                for f in ultimas:
                    print("   fim do log:", f)
                arq = [x for x in os.listdir(base) if x.startswith("log_envios_tms") and x.endswith(".csv")]
                for a in arq:
                    por_cli = defaultdict(Counter)
                    with open(os.path.join(base, a), encoding="utf-8", errors="replace", newline="") as f:
                        leitor = csv.reader(f)
                        next(leitor, None)
                        for row in leitor:
                            if len(row) >= 17 and row[16][:10] >= ("2026-09-20" if d.endswith("MQF") else corte):
                                chave = cli(row[13])
                                por_cli[chave][row[14] or "vazio"] += 1
                                if row[14] != "enviado":
                                    por_cli[chave]["motivo: " + limpa(row[15])[:60]] += 1
                    print("  ", a, "por cliente (_08: 10 dias; MQF: desde 20/09):")
                    for k in sorted(por_cli):
                        print("     ", k, dict(por_cli[k].most_common(5)))
            PY
            python3 /tmp/sonda_total_$$.py
            rm -f /tmp/sonda_total_$$.py
