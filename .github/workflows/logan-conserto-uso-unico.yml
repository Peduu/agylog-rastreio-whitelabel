# USO UNICO: conserto da rotina Logan->TMS (/home/projetos/atualizar_logan): (1) pedido sem cadastro no rastreio nao derruba
# mais a execucao inteira; (2) segunda opcao: lista da recuperacao por pedido montada com os pedidos enviados a Logan.
# Sem "APLICAR" so relata. Backup do main.py e do .env antes; se aparecer erro novo depois, restaura sozinho.
# Apagar este arquivo depois do uso.
name: "Uso unico - Conserto da rotina Logan para TMS"

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Vazio = so relata. Digite APLICAR para gravar (com backup antes)"
        required: false
        default: ""
        type: string

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Conserto na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: CONFIRMAR
          command_timeout: 15m
          script: |
            set -euo pipefail
            D=/home/projetos/atualizar_logan
            P="$D/ocoren_logan_tms"
            mask() { sed -E 's/[0-9]{5,}/99999/g; s/\b[A-Z0-9]{9,}\b/***/g'; }
            test -f "$P/main.py" && test -f "$D/.env" || { echo "ERRO: rotina nao encontrada. Nada foi alterado."; exit 1; }
            T=$(mktemp -d)
            echo "" | base64 -d > "$T/gerar_lista_recuperacao.py"
            echo "" | base64 -d > "$T/aplicar_patch.py"
            python3 -m py_compile "$T/gerar_lista_recuperacao.py"
            cp -p "$P/main.py" "$T/main.py"
            if ! python3 "$T/aplicar_patch.py" "$T/main.py"; then rm -rf "$T"; exit 1; fi
            echo "== .env hoje (so as variaveis que mudam)"
            grep -E "^(DCE_RECOVERY_ORDERS_FILE|DCE_RECOVERY_BATCH_SIZE)=" "$D/.env" | sed 's/^/   /'
            if [ "${CONFIRMAR:-}" != "APLICAR" ]; then
              echo "SO RELATO: o patch encaixa no main.py do servidor e compila. Nada foi alterado. Rode com confirmar = APLICAR."
              rm -rf "$T"; exit 0
            fi
            B="$D/backups-claude-$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$B"
            cp -p "$P/main.py" "$D/.env" "$B/"
            echo "backup: $B"
            DONO=$(stat -c '%u:%g' "$P/main.py")
            install -m 0644 "$T/gerar_lista_recuperacao.py" "$P/gerar_lista_recuperacao.py" && chown "$DONO" "$P/gerar_lista_recuperacao.py"
            cp -p "$T/main.py.novo" "$P/main.py.novo" && chown "$DONO" "$P/main.py.novo" && chmod --reference="$B/main.py" "$P/main.py.novo"
            mv -f "$P/main.py.novo" "$P/main.py"
            python3 - "$D/.env" <<'PY'
            import sys
            from pathlib import Path
            p = Path(sys.argv[1])
            linhas = p.read_text(encoding="utf-8").splitlines()
            novos = {"DCE_RECOVERY_ORDERS_FILE": "/home/projetos/atualizar_logan/pedidos_recuperacao.txt", "DCE_RECOVERY_BATCH_SIZE": "20"}
            feitos = set()
            for i, l in enumerate(linhas):
                k = l.split("=", 1)[0].strip()
                if k in novos:
                    linhas[i] = f"{k}={novos[k]}"
                    feitos.add(k)
            linhas += [f"{k}={v}" for k, v in novos.items() if k not in feitos]
            p.write_text("\n".join(linhas) + "\n", encoding="utf-8")
            PY
            echo "== .env depois"
            grep -E "^(DCE_RECOVERY_ORDERS_FILE|DCE_RECOVERY_BATCH_SIZE)=" "$D/.env" | sed 's/^/   /'
            cd "$D" && echo "lista gerada agora (pedidos): $(python3 -c 'from ocoren_logan_tms.gerar_lista_recuperacao import gerar_se_preciso; print(gerar_se_preciso())')"
            INICIO=$(date '+%Y-%m-%d %H:%M:%S')
            echo "== esperando 2 execucoes do timer que COMECARAM depois da mudanca (a que ja rodava usa o codigo antigo; ate 8 min)"
            n=0; DEPOIS=""
            for i in $(seq 1 48); do
              sleep 10
              J=$(journalctl -u ocoren-logan-tms.service --since "$INICIO" --no-pager -o short-iso 2>/dev/null || true)
              PRIMEIRO=$(printf '%s\n' "$J" | grep -m1 "Starting Processador" | awk '{print $1}')
              [ -n "$PRIMEIRO" ] || continue
              DEPOIS=$(printf '%s\n' "$J" | awk -v t="$PRIMEIRO" '$1 >= t')
              n=$(printf '%s\n' "$DEPOIS" | grep -c "Deactivated successfully\|Failed with result" || true)
              [ "$n" -ge 2 ] && break
            done
            ERROS=$(printf '%s\n' "$DEPOIS" | grep -c "Traceback" || true)
            echo "execucoes novas concluidas: $n | tracebacks nelas: $ERROS"
            if [ "$ERROS" -gt 0 ]; then
              echo "ERRO NOVO: restaurando o backup"
              printf '%s\n' "$DEPOIS" | grep -A2 "Error\|error" | tail -12 | mask
              cp -p "$B/main.py" "$P/main.py"; cp -p "$B/.env" "$D/.env"; rm -f "$P/gerar_lista_recuperacao.py" "$D/pedidos_recuperacao.txt"
              rm -rf "$T"; exit 1
            fi
            echo "== processor.log depois da mudanca (resumo, mascarado)"
            L="$P/runtime/logs/processor.log"
            awk -v t="$INICIO" '$0 >= t' "$L" > "$T/novo.log" || true
            echo "   linhas novas: $(wc -l < "$T/novo.log")"
            for padrao in "Lista da recuperacao por pedido atualizada" "Recuperação enviada ao TMS" "Recuperação já enviada" "Arquivo finalizado" "CNPJ do embarcador nao encontrado" "Linha enviada" "Erro no envio ao TMS" "cooldown" "Codigo SimExpress sem DeXPara"; do
              echo "   $(grep -c "$padrao" "$T/novo.log" || true) x $padrao"
            done
            grep "Arquivo finalizado" "$T/novo.log" | tail -3 | mask | cut -c1-200 | sed 's/^/   /'
            rm -rf "$T"
            echo "APLICADO."
