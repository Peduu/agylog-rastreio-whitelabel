# USO UNICO (so leitura): linhas do log da recuperacao Logan para os pedidos do segredo temporario SONDA_CODIGOS6 (codigo
# trocado por PEDIDO no log). Nao grava nada. Apagar este arquivo e o segredo depois do uso.
name: "Uso unico - Log da recuperacao Logan (pedidos avulsos)"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Log so leitura na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          CODIGOS: ${{ secrets.SONDA_CODIGOS6 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: CODIGOS
          script: |
            set -uo pipefail
            L=/home/projetos/atualizar_logan/ocoren_logan_tms/runtime/logs/recuperacao.log
            i=0
            for c in $(printf '%s' "$CODIGOS" | tr ',' ' '); do
              i=$((i+1))
              echo "== pedido $i"
              grep -F "$c" "$L" | tail -4 | sed "s/$c/PEDIDO/g" | sed -E 's/[0-9]{5,}/99999/g' | cut -c1-260 | sed 's/^/   /'
            done
