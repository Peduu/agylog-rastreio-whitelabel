# USO UNICO (so leitura): Sonda da vistoria do prazo.
# Dados de pedidos vem do segredo temporario SONDA_AMOSTRA (o repositorio e publico; o log mostra so totais, formatos e hashes,
# nunca pedido, CEP, nome ou CNPJ). Nao grava nada. Apagar este arquivo e o segredo SONDA_AMOSTRA depois do uso.
name: "Uso unico - Sonda da vistoria do prazo"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sonda so leitura na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          AMOSTRA: ${{ secrets.SONDA_AMOSTRA }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: AMOSTRA
          command_timeout: 15m
          script: |
            set -euo pipefail
            AMOSTRA="$AMOSTRA" python3 - <<'PY'
            import base64, gzip, hashlib, json, os, re, sqlite3, urllib.request
            from collections import Counter, defaultdict
            from datetime import datetime
            from pathlib import Path

            MOD = os.environ.get("SONDA_MODELOS", "/home/subir_arquivos/envios_modelos.db")
            PORTAL = os.environ.get("SONDA_PORTAL", "/home/rastreamento/database.db")
            ENV = os.environ.get("SONDA_ENV", "/etc/rastreamento.env")


            def forma(v):
                """so o formato (letras -> A, digitos -> 9), nunca o valor"""
                return (type(v).__name__ + ":" + re.sub(r"[0-9]", "9", re.sub(r"[^\W\d_]", "A", str(v))))[:28]


            def data_de(v):
                t = str(v or "").strip()
                for fmt in ("%Y-%m-%d", "%d/%m/%Y", "%Y/%m/%d"):
                    try:
                        return datetime.strptime(t[:10], fmt).date().isoformat()
                    except ValueError:
                        pass
                return ""


            def h(v):
                return hashlib.sha256(str(v).encode()).hexdigest()[:6]


            env = {}
            for linha in open(ENV, encoding="utf-8", errors="replace"):
                linha = linha.strip()
                if linha and not linha.startswith("#") and "=" in linha:
                    k, v = linha.split("=", 1)
                    env[k.replace("export ", "").strip()] = v.strip().strip('"').strip("'")
            TOKEN = env.get("TMS_API_TOKEN", "")
            URL = env.get("TMS_API_URL") or "https://corellilog.tmselite.com/api/ocorrencias/ocorrencianotafiscaldepara"
            print("token do TMS presente:", bool(TOKEN))

            amostra = [l.split(";") for l in gzip.decompress(base64.b64decode(os.environ["AMOSTRA"])).decode().splitlines() if l.strip()]
            print("amostra:", sorted(Counter(a[6] for a in amostra).items()))

            print("\n=== 1. base de enderecos (registros_modelo) ===")
            m = sqlite3.connect(Path(MOD).resolve().as_uri() + "?mode=ro", uri=True)
            m.row_factory = sqlite3.Row
            cols = [c[1] for c in m.execute("PRAGMA table_info(registros_modelo)").fetchall()]
            print("colunas:", cols)
            recentes = m.execute("SELECT * FROM registros_modelo WHERE date(criado_em) >= date('now', '-30 day')").fetchall()
            print("linhas dos ultimos 30 dias:", len(recentes))
            for c in cols:
                cheios = [r[c] for r in recentes if str(r[c] if r[c] is not None else "").strip()]
                extra = ""
                if re.search(r"servi|tipo|status|situa", c, re.I):
                    extra = f" | valores: {Counter(str(v)[:20] for v in cheios).most_common(8)}"
                print(f"  {c}: {len(cheios)}/{len(recentes)} | {Counter(forma(v) for v in cheios).most_common(3)}{extra}")
            try:
                print("legado (campos):", [tuple(r) for r in m.execute(
                    "SELECT campo, COUNT(*) FROM registros_modelo_legado GROUP BY campo ORDER BY 2 DESC LIMIT 40").fetchall()])
            except sqlite3.Error as e:
                print("legado: erro", type(e).__name__)

            print("\n=== 2. amostra x base: achou e quais colunas de data batem com o Prazo Atual do TMS ===")
            achou = Counter()
            bate = defaultdict(Counter)
            for ped, cnpj, cnpjf, tipo, pa, cad, g in amostra:
                r = m.execute("SELECT * FROM registros_modelo WHERE nroPedido = ? OR idSolicitacaoInterno = ? "
                              "ORDER BY datetime(criado_em) DESC LIMIT 1", (ped, ped)).fetchone()
                achou[(g, bool(r))] += 1
                if r:
                    for c in cols:
                        d = data_de(r[c])
                        if d:
                            bate[g][(c, "=PRAZO_TMS" if d == pa else ("=cadastro" if d == cad else "outra"))] += 1
            for k in sorted(achou):
                print(" ", k, achou[k])
            for g in sorted(bate):
                print(" ", g, sorted(bate[g].items()))
            m.close()

            print("\n=== 3. portal: rastreios e importacoes ===")
            p = sqlite3.connect(Path(PORTAL).resolve().as_uri() + "?mode=ro", uri=True)
            print("colunas de rastreios:", [c[1] for c in p.execute("PRAGMA table_info(rastreios)").fetchall()])
            print("rastreios total:", p.execute("SELECT COUNT(*) FROM rastreios").fetchone()[0])
            cnpj_amostra = {a[1] for a in amostra} | {a[2] for a in amostra}
            por_cnpj = p.execute("SELECT replace(replace(replace(IFNULL(cnpj_cliente,''),'.',''),'/',''),'-','') c, COUNT(*), MAX(data_cadastro_portal) "
                                 "FROM rastreios GROUP BY c ORDER BY 2 DESC").fetchall()
            print("rastreios por cliente (hash do CNPJ):", [(h(c), n, str(mx)[:10]) for c, n, mx in por_cnpj][:30])
            achou_r = Counter()
            for ped, cnpj, cnpjf, tipo, pa, cad, g in amostra:
                achou_r[(g, bool(p.execute("SELECT 1 FROM rastreios WHERE codigo = ?", (ped.upper(),)).fetchone()))] += 1
            print("amostra no rastreios:", sorted(achou_r.items()))
            try:
                print("ultimas importacoes:", p.execute("SELECT tipo_importacao, inseridos, atualizados, ignorados, data_hora FROM log_updates "
                                                        "ORDER BY id DESC LIMIT 15").fetchall())
            except sqlite3.Error as e:
                print("log_updates: erro", type(e).__name__)
            p.close()

            print("\n=== 4. API do TMS: servico de cada pedido da amostra ===")


            def consulta(cnpj, pedidos):
                body = json.dumps({"cnpjEmbarcador": cnpj, "listaPedidos": pedidos}).encode()
                req = urllib.request.Request(URL, data=body, headers={"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json",
                                                                      "Accept": "application/json"})
                with urllib.request.urlopen(req, timeout=60) as resp:
                    return json.loads(resp.read().decode("utf-8"))


            por_cnpj = defaultdict(list)
            for a in amostra:
                por_cnpj[a[1]].append(a)
            servicos = {}
            chaves = Counter()
            falhas = Counter()
            tem_cadastro = {}
            for cnpj, itens in por_cnpj.items():
                for i in range(0, len(itens), 20):
                    lote = itens[i:i + 20]
                    try:
                        data = consulta(cnpj, [x[0] for x in lote])
                    except Exception as e:
                        falhas[type(e).__name__] += 1
                        continue
                    if data.get("flagErro"):
                        falhas["flagErro"] += 1
                    for oc in data.get("listaResultados") or []:
                        chaves.update(oc.keys())
                        ped = str(oc.get("nroPedido") or "").strip().upper()
                        servicos.setdefault(ped, Counter())[str(oc.get("servico"))[:30]] += 1
                        if str(oc.get("codigoOcorrencia", "")).strip() == "1":
                            tem_cadastro[ped] = data_de(oc.get("dtOcorrencia"))
            print("falhas:", dict(falhas))
            print("campos das ocorrencias:", sorted(chaves))
            conf = Counter()
            cad_ok = Counter()
            for ped, cnpj, cnpjf, tipo, pa, cad, g in amostra:
                sv = servicos.get(ped.upper())
                conf[(g, tipo, "nao achou" if not sv else "|".join(sorted(sv)))] += 1
                if ped.upper() in tem_cadastro:
                    cad_ok[(g, "ocorrencia 1 = Dt.Cadastro" if tem_cadastro[ped.upper()] == cad else "ocorrencia 1 DIFERENTE")] += 1
                elif sv:
                    cad_ok[(g, "sem ocorrencia 1")] += 1
            print("grupo x tipo do relatorio x servico na API:")
            for k in sorted(conf):
                print(" ", k, conf[k])
            print("ocorrencia 1:", sorted(cad_ok.items()))
            PY
