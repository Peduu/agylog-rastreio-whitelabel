# USO UNICO (so leitura): descobre por que um pedido a caminho nao recebe prazo na pagina publica.
# O numero do pedido vem do segredo temporario SONDA_PEDIDO (o repositorio e publico; o log mostra so sim/nao, contagens,
# formatos e datas, nunca pedido, CEP ou nome). Nao grava nada.
# Apagar este arquivo e o segredo SONDA_PEDIDO depois do uso.
name: "Uso unico - Sonda do prazo de um pedido"

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ler a base de enderecos na VPS (so leitura)
        uses: appleboy/ssh-action@v1.0.3
        env:
          PEDIDO: ${{ secrets.SONDA_PEDIDO }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: PEDIDO
          script: |
            set -euo pipefail
            PEDIDO="$PEDIDO" python3 - <<'PY'
            import json, os, re, sqlite3, sys, urllib.request
            from collections import Counter
            from pathlib import Path

            MODELOS = "/home/subir_arquivos/envios_modelos.db"
            p = os.environ.get("PEDIDO", "").strip().upper()
            if not p:
                sys.exit("ERRO: segredo SONDA_PEDIDO vazio")

            def forma(v):
                # so o formato (letras -> A, digitos -> 9), nunca o valor
                return type(v).__name__ + ":" + re.sub(r"[0-9]", "9", re.sub(r"[A-Za-z]", "A", str(v)))

            print("base de enderecos existe:", os.path.exists(MODELOS))
            m = sqlite3.connect(Path(MODELOS).resolve().as_uri() + "?mode=ro", uri=True)

            def um(sql, args=()):
                return m.execute(sql, args).fetchone()[0]

            tabelas = [r[0] for r in m.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")]
            for t in tabelas:
                cols = m.execute(f'PRAGMA table_info("{t}")').fetchall()
                chave = [(c[1], c[2]) for c in cols if re.search(r"pedido|solicit|cep|criado|modelo_nome|campo|valor", c[1], re.I)]
                total = um('SELECT COUNT(*) FROM "%s"' % t)
                print(f"tabela {t}: {total} linhas | colunas:", chave)

            print("tipos de nroPedido:", m.execute("SELECT typeof(nroPedido), COUNT(*) FROM registros_modelo GROUP BY 1").fetchall())
            recentes = [r[0] for r in m.execute("SELECT nroPedido FROM registros_modelo ORDER BY datetime(criado_em) DESC, rowid DESC LIMIT 3000")]
            print("formatos de nroPedido (3000 mais recentes):", Counter(forma(v) for v in recentes).most_common(8))
            print("criado_em mais recente:", um("SELECT MAX(criado_em) FROM registros_modelo"))
            print("linhas por dia desde 08/10:", m.execute(
                "SELECT date(criado_em), COUNT(*) FROM registros_modelo WHERE date(criado_em) >= '2026-10-08' GROUP BY 1 ORDER BY 1").fetchall())

            print("--- o pedido ---")
            print("nroPedido igual:", um("SELECT COUNT(*) FROM registros_modelo WHERE nroPedido IN (?)", (p,)))
            print("idSolicitacaoInterno igual:", um("SELECT COUNT(*) FROM registros_modelo WHERE idSolicitacaoInterno IN (?)", (p,)))
            print("nroPedido como texto aparado (inclui .0):", um(
                "SELECT COUNT(*) FROM registros_modelo WHERE TRIM(CAST(nroPedido AS TEXT)) IN (?, ?)", (p, p + ".0")))
            print("nroPedido sem zeros a esquerda:", um(
                "SELECT COUNT(*) FROM registros_modelo WHERE LTRIM(TRIM(CAST(nroPedido AS TEXT)), '0') IN (?, ?)", (p.lstrip("0"), p.lstrip("0") + ".0")))
            contem = m.execute("SELECT nroPedido, date(criado_em) FROM registros_modelo WHERE UPPER(CAST(nroPedido AS TEXT)) LIKE ? "
                               "ORDER BY datetime(criado_em) DESC LIMIT 15", (f"%{p}%",)).fetchall()
            print("nroPedido contendo o numero (pode ser outro pedido):", [(forma(v), d) for v, d in contem])
            achados = m.execute(
                "SELECT nroPedido, idSolicitacaoInterno, destinatario_cep, date(criado_em), IFNULL(modelo_nome, '') FROM registros_modelo "
                "WHERE TRIM(CAST(nroPedido AS TEXT)) IN (?, ?) OR LTRIM(TRIM(CAST(nroPedido AS TEXT)), '0') IN (?, ?) OR idSolicitacaoInterno = ?",
                (p, p + ".0", p.lstrip("0"), p.lstrip("0") + ".0", p)).fetchall()
            for nro, ids, cep, dia, modelo in achados:
                print("achado:", forma(nro), "| AR:", forma(ids), "| CEP:", forma(cep), "| criado:", dia, "| modelo da Simple:", "SIMPLE" in modelo.upper())

            if "registros_modelo_legado" in tabelas:
                cols = {r[1] for r in m.execute("PRAGMA table_info(registros_modelo_legado)")}
                if {"campo", "valor"} <= cols:
                    print("legado com o numero (campos):", m.execute(
                        "SELECT campo, COUNT(*) FROM registros_modelo_legado WHERE TRIM(CAST(valor AS TEXT)) IN (?, ?) GROUP BY campo",
                        (p, p + ".0")).fetchall())

            for t in tabelas:
                for c in m.execute(f'PRAGMA table_info("{t}")').fetchall():
                    if re.search(r"pedido", c[1], re.I) and t != "registros_modelo":
                        n = um(f'SELECT COUNT(*) FROM "{t}" WHERE UPPER(TRIM(CAST("{c[1]}" AS TEXT))) IN (?, ?)', (p, p + ".0"))
                        print(f"outra tabela {t}.{c[1]}: {n}")
            print("modelos da Simple (linhas):", um("SELECT COUNT(*) FROM registros_modelo WHERE UPPER(IFNULL(modelo_nome, '')) LIKE '%SIMPLE%'"),
                  "| mais recente:", um("SELECT MAX(date(criado_em)) FROM registros_modelo WHERE UPPER(IFNULL(modelo_nome, '')) LIKE '%SIMPLE%'"))
            m.close()

            print("--- a pagina ---")
            sys.path.insert(0, "/home/rastreamento")
            import prazo_cep
            print("prazo_cep acha o CEP:", bool(prazo_cep.cep_do_pedido(MODELOS, [p])))
            req = urllib.request.Request("http://127.0.0.1:8000/api/rastrear", data=json.dumps({"codigo": p}).encode(),
                                         headers={"Content-Type": "application/json"})
            d = json.loads(urllib.request.urlopen(req, timeout=40).read().decode("utf-8"))
            print("status:", d.get("status"), "| previsao na pagina:", bool(d.get("previsao")))
            PY
