# USO UNICO: roda uma vez a recuperacao por pedido da Logan so para pedidos do segredo temporario SONDA_CODIGOS6 (lista e
# cursor temporarios; nao mexe na lista principal). Apagar este arquivo e o segredo depois do uso.
name: "Uso unico - Recuperacao Logan de pedidos avulsos"

on:
  workflow_dispatch:

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperacao avulsa na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          CODIGOS: ${{ secrets.SONDA_CODIGOS6 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: CODIGOS
          script: |
            set -uo pipefail
            D=/home/projetos/atualizar_logan
            T=$(mktemp -d)
            printf '%s\n' "$CODIGOS" | tr ',' '\n' > "$T/pedidos.txt"
            echo "pedidos na lista temporaria: $(grep -c . "$T/pedidos.txt")"
            cd "$D"
            DCE_RECOVERY_ORDERS_FILE="$T/pedidos.txt" DCE_RECOVERY_BATCH_SIZE=10 DCE_RECOVERY_CURSOR_PATH="$T/cursor.txt" \
              LOGAN_LISTA_SAIDA="$T/lista_nao_usada.txt" python3 -m ocoren_logan_tms.recuperacao_pedidos
            echo "saida: $?"
            tail -12 "$D/ocoren_logan_tms/runtime/logs/recuperacao.log" | grep -E "Recupera|Erro|cooldown|Nenhum" | sed -E 's/[0-9]{5,}/99999/g; s/[A-Z0-9]{9,}/***/g' | cut -c1-170
            rm -rf "$T"
